# 경로 나누기(nginx). Traefik → dify-nginx:80 → api·web·plugin-daemon·api-ws (files/nginx/default.conf)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dify-nginx
  template:
    metadata:
      labels:
        app: dify-nginx
    spec:
      # node-01 에 모은다(사용자 지시 2026-11-20). 우선 배치라 node-01 이 꺼지면 다른 노드에서 뜬다.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [bbb-node-01]
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /nginx-healthz, port: 80}
          periodSeconds: 15
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {memory: 256Mi}
      volumes:
      - name: conf
        configMap:
          name: dify-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: dify-nginx
spec:
  selector:
    app: dify-nginx
  ports:
  - port: 80
    targetPort: 80

# 플러그인 실행기(모델 공급자·도구 플러그인). DB 는 dify_plugin, 설치 파일은 PVC dify-plugin-storage.
# 마켓플레이스(marketplace.dify.ai)·pip 에서 받으므로 인터넷이 필요하다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-plugin-daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dify-plugin-daemon
  template:
    metadata:
      labels:
        app: dify-plugin-daemon
    spec:
      enableServiceLinks: false
      initContainers:
      - name: init-permissions
        image: busybox:1.37
        command: ["sh", "-c", "([ -f /s/.init_permissions ] || (chown -R 1001:1001 /s && touch /s/.init_permissions)) && chown 1001:1001 /c"]
        volumeMounts:
        - name: storage
          mountPath: /s
        - name: cwd
          mountPath: /c
      containers:
      - name: plugin-daemon
        image: langgenius/dify-plugin-daemon:0.6.14-local
        envFrom:
        - secretRef:
            name: dify-db
        env:
        - {name: DB_TYPE, value: postgresql}
        - {name: DB_DATABASE, value: dify_plugin}
        - {name: DB_SSL_MODE, value: disable}
        - {name: REDIS_HOST, value: redis-service.bbb-namespace.svc.cluster.local}
        - {name: REDIS_PORT, value: "6379"}
        - {name: REDIS_PASSWORD, value: ""}
        - {name: REDIS_DB, value: "10"}
        - {name: SERVER_PORT, value: "5002"}
        - name: SERVER_KEY
          valueFrom:
            secretKeyRef: {name: dify-secret, key: PLUGIN_DAEMON_KEY}
        - {name: DIFY_INNER_API_URL, value: "http://dify-api:5001"}
        - name: DIFY_INNER_API_KEY
          valueFrom:
            secretKeyRef: {name: dify-secret, key: INNER_API_KEY_FOR_PLUGIN}
        - {name: PLUGIN_REMOTE_INSTALLING_HOST, value: "0.0.0.0"}
        - {name: PLUGIN_REMOTE_INSTALLING_PORT, value: "5003"}
        - {name: PLUGIN_STORAGE_TYPE, value: local}
        - {name: PLUGIN_STORAGE_LOCAL_ROOT, value: /app/storage}
        # 실행 폴더(압축 푼 플러그인 + 파이썬 가상환경, 작은 파일 수만 개)는 노드 디스크(emptyDir).
        # NFS(HDD)에 두면 설치·기동이 몇 분씩 걸린다(2026-11-15). 원본 패키지는 NFS(plugin·plugin_packages)에 남아,
        # 파드가 다시 뜨면 데몬이 거기서 이 폴더를 다시 만든다(그동안 1~3분 플러그인 사용 불가).
        - {name: PLUGIN_WORKING_PATH, value: /app/cwd}
        - {name: PLUGIN_INSTALLED_PATH, value: plugin}
        - {name: PLUGIN_MEDIA_CACHE_PATH, value: assets}
        - {name: PLUGIN_PACKAGE_CACHE_PATH, value: plugin_packages}
        - {name: MAX_PLUGIN_PACKAGE_SIZE, value: "52428800"}
        # 플러그인 설치(pip 내려받기 + NFS 에 가상환경 쓰기)가 120초를 넘겨 죽었다(2026-11-14) → 15분
        - {name: PYTHON_ENV_INIT_TIMEOUT, value: "900"}
        - {name: UV_CACHE_DIR, value: /tmp/.uv-cache}   # 내려받기 캐시는 노드 디스크(emptyDir), NFS 아님
        - {name: PLUGIN_MAX_EXECUTION_TIMEOUT, value: "600"}
        - {name: FORCE_VERIFYING_SIGNATURE, value: "true"}
        - {name: PPROF_ENABLED, value: "false"}
        ports:
        - containerPort: 5002
        readinessProbe:
          tcpSocket: {port: 5002}
          periodSeconds: 15
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: tmp
          mountPath: /tmp
        - name: cwd
          mountPath: /app/cwd
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 3Gi}
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: dify-plugin-storage
      - name: tmp
        emptyDir: {sizeLimit: 5Gi}
      - name: cwd
        emptyDir: {sizeLimit: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: dify-plugin-daemon
spec:
  selector:
    app: dify-plugin-daemon
  ports:
  - port: 5002
    targetPort: 5002

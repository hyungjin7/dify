          default: ''
      height: 90
      id: start
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - type: text
            value: '{"url": "https://stock.naver.com/news/mainnews", "wait_until": "networkidle", "wait_ms": 2000, "include_links": true, "scroll_times": 20, "scroll_wait_ms": 1200, "min_links": 260}'
          type: json
        desc: 목록 화면 글자와 링크(아래로 내려 더 불러옴, 최대 100건)
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 2000
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 180
          max_write_timeout: 30
        title: 주요뉴스 목록 열기(ego)
        type: http-request
        url: http://ego.bbb-namespace.svc.cluster.local:8017/api/v1/ego/page
        variables: []
      height: 90
      id: fetch
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json
          import re

          # 기사 주소 모양: 네이버 뉴스(n.news.naver.com/.../article/…) 등
          ARTICLE = re.compile(r"/article/|news_read|/news/[A-Za-z_]+/\d+|/news/\d+|[?&](article_?id|aid|nid)=")
          LISTING = re.compile(r"/news/(mainnews|flashnews|ranking|search|list|category)\b|/news/?$|[?&]page=")
          DATED = re.compile(r"^(.*?\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.\s*\d{1,2}:\d{2})")


          def short_title(text):
              # 목록 링크 글자 = 제목·코너·날짜·본문 앞부분·매체. 날짜·시간까지만 제목으로 쓴다.
              m = DATED.match(text)
              return (m.group(1) if m else text)[:200]


          def main(body: str, status_code: int, count: str) -> dict:
              try:
                  page = json.loads(body or "{}")
              except ValueError:
                  page = {}
              try:
                  n = max(1, min(100, int(count or 100)))   # 상한 100건(2026-11-19 사용자 지시)
              except ValueError:
                  n = 100
              if status_code != 200 or not page.get("text"):
                  return {"check_body": json.dumps({"items": []}), "note": f"목록 화면을 못 읽었습니다(상태 {status_code})"}
              cands = []
              for l in page.get("links") or []:
                  href = str(l.get("href") or "").split("#")[0]
                  text = " ".join(str(l.get("text") or "").split())
                  if len(text) < 12 or LISTING.search(href):
                      continue
                  rank = 0 if ARTICLE.search(href) else (1 if "news" in href.lower() else 9)
                  if rank < 9:
                      cands.append((rank, href, text))
              items, seen = [], set()
              for rank, href, text in sorted(cands, key=lambda c: c[0]):
                  if href in seen:
                      continue
                  seen.add(href)
                  items.append({"url": href, "title": short_title(text)})
                  if len(items) >= n:
                      break
              note = f"목록 링크 {len(page.get('links') or [])}개 중 기사 {len(items)}개"
              return {"check_body": json.dumps({"items": items}, ensure_ascii=False), "note": note}
        code_language: python3
        desc: 링크에서 기사 주소 N개
        outputs:
          check_body:
            children: null
            type: string
          note:
            children: null
            type: string
        selected: false
        title: 기사 고르기
        type: code
        variables:
        - value_selector:
          - fetch
          - body
          variable: body
        - value_selector:
          - fetch
          - status_code
          variable: status_code
        - value_selector:
          - start
          - count
          variable: count
      height: 90
      id: pick
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config:
            api_key: '{{#env.news_api_key#}}'
            header: ''
            type: bearer
          type: api-key
        body:
          data:
          - type: text
            value: '{{#pick.check_body#}}'
          type: json
        desc: news 가 기존 기사·앞 시간 요약과 비교
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 2000
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 60
          max_write_timeout: 30
        title: 중복 확인(news)
        type: http-request
        url: http://news-service.bbb-namespace.svc.cluster.local:8005/dify/news/check
        variables: []
      height: 90
      id: check
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(body: str, status_code: int) -> dict:
              # news 판정: new(처음) · duplicate(이미 저장) · similar(비슷한 기사) + summarized(앞 시간 요약에 이미 씀) + use(이번에 씀)
              try:
                  res = json.loads(body or "{}")
              except ValueError:
                  res = {}
              items = res.get("items") or []
              fetch = [i["url"] for i in items if i.get("use") and i.get("status") in ("new", "similar") and i.get("url")]
              reuse = [i for i in items if i.get("use") and i.get("status") == "duplicate" and i.get("stored")]
              skipped = sum(1 for i in items if not i.get("use"))
              pages = {"urls": fetch or ["about:blank"], "wait_until": "domcontentloaded", "wait_ms": 800, "max_chars": 3000}
              note = (f"새 기사 {len(fetch)}건, 저장돼 있던 기사 {len(reuse)}건, 앞 시간과 겹쳐 뺀 기사 {skipped}건"
                      + ("" if status_code == 200 else f" (news 판정 실패 {status_code}: {str(body)[:200]})"))
              titles = {i["url"]: i.get("title") or "" for i in items}
              return {"pages_body": json.dumps(pages), "reuse": json.dumps(reuse, ensure_ascii=False),
                      "titles": json.dumps(titles, ensure_ascii=False), "note": note}
        code_language: python3
        desc: 새 기사만 본문을 연다
        outputs:
          pages_body:
            children: null
            type: string
          reuse:
            children: null
            type: string
          titles:
            children: null
            type: string
          note:
            children: null
            type: string
        selected: false
        title: 열 기사 정하기
        type: code
        variables:
        - value_selector:
          - check
          - body
          variable: body
        - value_selector:
          - check
          - status_code
          variable: status_code
      height: 90
      id: plan
      position:
        x: 1280
        y: 280
      positionAbsolute:
        x: 1280
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - type: text
            value: '{{#plan.pages_body#}}'
          type: json
        desc: 새 기사만 ego 로 연다
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 2000
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 600
          max_write_timeout: 30
        title: 기사 본문 열기(ego)
        type: http-request
        url: http://ego.bbb-namespace.svc.cluster.local:8017/api/v1/ego/pages
        variables: []
      height: 90
      id: articles
      position:
        x: 1580
        y: 280
      positionAbsolute:
        x: 1580
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(body: str, titles: str) -> dict:
              # ego 로 받은 본문 → news 에 저장할 목록
              try:
                  res = json.loads(body or "{}")
              except ValueError:
                  res = {}
              try:
                  tmap = json.loads(titles or "{}")
              except ValueError:
                  tmap = {}
              items, bad = [], 0
              for it in res.get("items") or []:
                  url = it.get("url") or ""
                  if url == "about:blank":
                      continue
                  text = (it.get("text") or "").strip()
                  if it.get("error") or len(text) < 200:
                      bad += 1
                      continue
                  items.append({"url": url, "title": tmap.get(url) or it.get("title") or "", "content": text})
              return {"save_body": json.dumps({"source": "Naver 주요뉴스", "items": items}, ensure_ascii=False),
                      "fetched": json.dumps(items, ensure_ascii=False), "bad": str(bad)}
        code_language: python3
        desc: 본문 있는 기사만
        outputs:
          save_body:
            children: null
            type: string
          fetched:
            children: null
            type: string
          bad:
            children: null
            type: string
        selected: false
        title: 저장할 기사 정리
        type: code
        variables:
        - value_selector:
          - articles
          - body
          variable: body
        - value_selector:
          - plan
          - titles
          variable: titles
      height: 90
      id: prep
      position:
        x: 1880
        y: 280
      positionAbsolute:
        x: 1880
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config:
            api_key: '{{#env.news_api_key#}}'
            header: ''
            type: bearer
          type: api-key
        body:
          data:
          - type: text
            value: '{{#prep.save_body#}}'
          type: json
        desc: news_articles 에 저장(중복은 news 가 다시 거름)
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 2000
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 120
          max_write_timeout: 30
        title: 기사 저장(news)
        type: http-request
        url: http://news-service.bbb-namespace.svc.cluster.local:8005/dify/news/save
        variables: []
      height: 90
      id: save
      position:
        x: 2180
        y: 280
      positionAbsolute:
        x: 2180
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(save_body: str, save_status: int, pick_note: str, plan_note: str, bad: str) -> dict:
              # 저장 결과를 한 줄로. 저장된 기사는 news 가 바로 버핏 판정(②)을 한다. 요약은 ③(08·12·15시)이 따로 한다.
              try:
                  res = json.loads(save_body or "{}") or {}
              except ValueError:
                  res = {}
              saved = len(res.get("saved") or [])
              skipped = len(res.get("skipped") or [])
              note = (f"{pick_note}. {plan_note}. 본문 못 읽음 {bad}건. 저장 {saved}건, 저장 안 함 {skipped}건"
                      + ("" if save_status == 200 else f" (저장 실패 HTTP {save_status})"))
              return {"saved": str(saved), "note": note}
        code_language: python3
        desc: 저장 건수와 단계별 건수를 한 줄로
        outputs:
          saved:
            children: null
            type: string
          note:
            children: null
            type: string
        selected: false
        title: 수집 결과 정리
        type: code
        variables:
        - value_selector:
          - save
          - body
          variable: save_body
        - value_selector:
          - save
          - status_code
          variable: save_status
        - value_selector:
          - pick
          - note
          variable: pick_note
        - value_selector:
          - plan
          - note
          variable: plan_note
        - value_selector:
          - prep
          - bad
          variable: bad
      height: 90
      id: tally
      position:
        x: 2480
        y: 280
      positionAbsolute:
        x: 2480
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 저장 건수와 메모. news 가 받아 로그에 남긴다
        outputs:
        - value_selector:
          - tally
          - saved
          variable: saved
        - value_selector:
          - tally
          - note
          variable: note
        selected: false
        title: 끝
        type: end
      height: 90
      id: end
      position:
        x: 2780
        y: 280
      positionAbsolute:
        x: 2780
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.6

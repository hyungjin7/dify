# 버핏 뉴스 ① 수집(2026-11-22 사용자 결정: 수집·판정·요약 2단계 분리, 수집은 매시 정각).
# 시작(slot) → ego 주요뉴스 목록+링크 → 기사 고르기 → news 중복 확인 → 새 기사만 ego 본문 → news 저장 → 수집 결과 정리 → 끝.
# LLM 을 부르지 않는다. 저장하면 news 가 바로 버핏 판정(② 상시 판정)을 한다. 요약은 news-hourly-summary-workflow.yml(③, 08·12·15시).
# 노드는 news-hourly-summary-workflow.yml 에서 옮겼다(그 파일에서는 뺐다).
# dcore 시간표 '버핏 뉴스 ① 수집 (매시)' → dworker news_hourly_collect → news POST /api/v1/news/hourly-collect/run → 이 앱.
# 올리기: SAVE_APP_KEY=news-dify-collect-app python3 deploy/k3s/samples/install_app.py deploy/k3s/samples/news-collect-workflow.yml

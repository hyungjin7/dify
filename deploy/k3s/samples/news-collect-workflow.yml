    nodes:
    - data:
        desc: 'dworker 가 매시 정각에 slot(예: 2026-11-22 09:00)을 넣어 부른다(버핏 뉴스 ① 수집)'
        selected: false
        title: 시작
        type: start
        variables:
        - label: 볼 기사 수
          max_length: 4
          options: []
          required: false
          type: text-input
          variable: count
          default: '100'
        - label: 시각(KST)
          max_length: 20
          options: []
          required: false

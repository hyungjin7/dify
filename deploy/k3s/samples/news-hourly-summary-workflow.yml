    - data:
        code: |
          import json
          import re


          def main(text: str, article_ids: str, new_count: str, report: str, sources: str) -> dict:
              # 생각(think) 블록이 섞여 나오면 뺀다. 숨김 표시는 화면에 안 보이고 news 가 읽어 기사 연결에 쓴다.
              # 순서: LLM 한눈에 → 버핏 필터 신호(5항목·DART 대조, news 가 만든 글) → 출처 (걸러낸 기사는 싣지 않음, 2026-11-21)
              body = re.sub(r"<think>.*?</think>", "", text or "", flags=re.S).strip()
              try:
                  src = json.loads(sources or "[]")
              except ValueError:
                  src = []
              # [기사N] 은 '신문사 n'(news 가 준 label) 링크로 바꾼다(2026-11-21 사용자 지시 "[기사1] → 한국경제 1").
              # 출처는 본문(한눈에·신호)에 나온 기사만 싣는다(번호 순서는 그대로). 전체는 i3 News Briefing
              cited = []

              def cite(n):
                  a = src[n - 1] if 0 < n <= len(src) else None
                  if not a:
                      return f"[기사{n}]"
                  if n not in cited:
                      cited.append(n)
                  label = a.get("label") or f"기사{n}"
                  url = a.get("url") or ""
                  return f"[[{label}]]({url})" if url.startswith("http") else f"[{label}]"

              def convert(t):
                  t = re.sub(r"\[\[([^\[\]]*?기사\s*\d+[^\[\]]*?)\]\]", r"[\1]", t or "")   # [[기사3]] → [기사3]
                  t = re.sub(r"\[([^\[\]]*?기사\s*\d+[^\[\]]*?)\](?!\()",
                             lambda m: " ".join(cite(int(x)) for x in re.findall(r"기사\s*(\d+)", m.group(1))), t)
                  return re.sub(r"(?<!\[)기사\s*(\d+)", lambda m: cite(int(m.group(1))), t)

              body, rep = convert(body), convert(report or "")
              links = []
              for n in sorted(cited):
                  a = src[n - 1]
                  label, url, title = a.get("label") or f"기사{n}", a.get("url") or "", (a.get("title") or "기사")[:80]
                  links.append(f"- **{label}** [{title}]({url})" if url.startswith("http") else f"- **{label}** {title}")
              parts = [body, rep.strip()]
              if src:
                  parts.append("### 🔗 출처 (본문에 나온 기사 · 전체는 News Briefing)\n" + ("\n".join(links) or "- 본문에 인용한 기사 없음"))
              ids = ",".join(x for x in (article_ids or "").replace(" ", "").split(",") if x.isdigit())
              out = "\n\n".join(p for p in parts if p)
              return {"result": f"{out}\n\n<!-- news-meta article_ids={ids} new_count={(new_count or '0').strip()} -->"}
        code_language: python3
        desc: 한눈에 + 버핏 필터 신호 + 출처를 글 하나로, 쓴 기사 번호는 글 끝 숨김 표시로 news 에 넘긴다
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 결과 정리
        type: code
        variables:
        - value_selector:
          - llm
          - text
          variable: text
        - value_selector:
          - bparse
          - article_ids
          variable: article_ids
        - value_selector:

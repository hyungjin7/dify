    - data:
        code: |
          import html
          import json
          import re

          LIMIT = 3800   # 텔레그램 한 번에 4096자까지. 넘으면 줄 단위로 자르고 i3 안내를 붙인다
          SOURCE_LIMIT = 1800   # 그중 출처 칸 몫(태그·주소 포함 글자 수)


          def inline(t):
              out, pos = [], 0
              for m in re.finditer(r"\[(\[?[^\[\]]+\]?)\]\((https?://[^)\s]+)\)", t):   # [[기사6]](url) 처럼 글자에 [] 가 있는 링크도
                  out.append(html.escape(t[pos:m.start()]))
                  out.append(f'<a href="{html.escape(m.group(2), quote=True)}">{html.escape(m.group(1))}</a>')
                  pos = m.end()
              out.append(html.escape(t[pos:]))
              s = "".join(out).replace("\\[", "[").replace("\\]", "]")
              return re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", s)


          def line(raw):
              t = raw.rstrip()
              if re.match(r"^\s*\|?\s*:?-{3,}", t):          # 표 구분 줄
                  return None
              if t.lstrip().startswith("|"):                    # 표 줄 → "• a · b · c"
                  cells = [c.strip() for c in t.strip().strip("|").split("|")]
                  return "• " + " · ".join(inline(c) for c in cells if c)
              m = re.match(r"^#{1,6}\s*(.+)$", t)
              if m:
                  return f"\n<b>{inline(m.group(1))}</b>"
              m = re.match(r"^(\s*)[-*]\s+(.+)$", t)
              if m:
                  return ("  " if m.group(1) else "") + "• " + inline(m.group(2))
              return inline(t)


          DATED = re.compile(r"^(.*?\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.\s*\d{1,2}:\d{2})")
          SOURCE_HEAD = re.compile(r"^#{2,4}[^\n]*출처[^\n]*$", re.M)


          def source_lines(sources, cited=None):
              # 출처는 기사 순서(= 본문 [기사N] 번호)대로 직접 만든다. 주소 없는 기사는 이유를 남긴다.
              out, missing = [], []
              for n, a in enumerate(sources, 1):
                  if cited is not None and n not in cited:   # 본문에 나온 기사만(번호는 그대로)
                      continue
                  title = html.escape(((DATED.match(a.get("title") or "") or [None, a.get("title") or ""])[1] or "")[:120])
                  url = (a.get("url") or "").strip()
                  label = html.escape(a.get("label") or f"기사{n}")
                  if url.startswith("http"):
                      out.append(f'• <b>{label}</b> <a href="{html.escape(url, quote=True)}">{title or "기사 보기"}</a>')
                  else:
                      out.append(f"• <b>{label}</b> {title} (주소 없음)")
                      missing.append(n)
              return out, missing


          def main(summary: str, chat_id: str, sources: str) -> dict:
              body = re.sub(r"<!--.*?-->", "", summary or "", flags=re.S).strip()
              try:
                  src = json.loads(sources or "[]")
              except ValueError:
                  src = []
              m0 = SOURCE_HEAD.search(body)
              head = body[:m0.start()] if m0 else body
              # 본문 인용은 '신문사 n' 링크(결과 정리 노드가 바꿈) → 주소가 본문에 나온 기사만 출처에 싣는다. 예전 글은 [기사N]
              cited = {n for n, a in enumerate(src, 1) if (a.get("url") or "").startswith("http") and a["url"] in head}
              cited |= {int(x) for x in re.findall(r"기사\s*(\d+)", head)}
              tail, missing = source_lines(src, cited)
              if src:   # LLM 이 쓴 출처 칸(주소가 빠지기도 함)은 떼고 직접 만든 출처를 붙인다
                  m = SOURCE_HEAD.search(body)
                  if m:
                      nxt = re.search(r"^#{1,3}\s", body[m.end():], re.M)
                      body = body[:m.start()] + (body[m.end() + nxt.start():] if nxt else "")
                  # 출처가 많으면(채널 기사 100건 이상) 출처만으로 4096자를 넘어 텔레그램이 400 을 낸다(2026-11-21).
                  # 출처는 글 한도의 절반까지만 싣고 나머지는 건수로 알린다.
                  keep, used = [], 0
                  for t in tail:
                      if used + len(t) + 1 > SOURCE_LIMIT:
                          break
                      keep.append(t)
                      used += len(t) + 1
                  if len(keep) < len(tail):
                      keep.append(f"• … 외 {len(tail) - len(keep)}건 · 전체는 i3 News Briefing")
                  tail = ["", "<b>🔗 출처</b> (본문에 나온 기사 · 전체는 News Briefing)"] + (keep or ["• 본문에 인용한 기사 없음"])
              tail_size = sum(len(t) + 1 for t in tail)
              lines, size, cut = [], tail_size, False
              for raw in body.splitlines():
                  h = line(raw)
                  if h is None:
                      continue
                  if size + len(h) + 1 > LIMIT:
                      cut = True
                      break
                  lines.append(h)
                  size += len(h) + 1
              text = re.sub(r"\n{3,}", "\n\n", "\n".join(lines)).strip()
              if cut:
                  text += "\n\n… 전체는 i3 News › 뉴스 요약(시간별)"
              if tail:
                  text += "\n" + "\n".join(tail)
              note = f"출처 {len(src)}건 중 {len(tail) - 2 if tail else 0}건 표시" + (f", 주소 없음: 기사 {', '.join(map(str, missing))}(news 저장 자료에 url 없음)" if missing else "")
              return {"note": note, "body": json.dumps({"chat_id": (chat_id or "").strip(), "text": text or "(요약 없음)", "parse_mode": "HTML",
                                          "disable_web_page_preview": True}, ensure_ascii=False)}
        code_language: python3
        desc: 요약을 텔레그램 글(HTML)로
        outputs:
          body:
            children: null
            type: string
          note:
            children: null
            type: string
        selected: false
        title: 텔레그램 글 만들기
        type: code
        variables:
        - value_selector:

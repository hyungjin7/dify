            ## {{#start.slot#}} 버핏 관점 뉴스

            ### 📰 이번 시간 한눈에
            - (해자를 강화·훼손하는 신호를 중요한 순서로 최대 3줄, 줄마다 [기사N])
            - (신호가 없으면 "해자를 바꾸는 구조적 신호 없음." 한 줄)

            - 사용자 요청이 있으면 그 주제 위주로 쓴다: {{#start.request#}}

            필터 집계: {{#bparse.tally#}}
            {{#pparse.summary#}}

            <신호>
            {{#bparse.signals#}}
            </신호>
        - id: user-prompt
          role: user
          text: '{{#start.slot#}} 버핏 뉴스 요약'
        selected: false

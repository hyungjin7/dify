        type: http-request
        url: http://news-service.bbb-namespace.svc.cluster.local:8005/dify/news/check
        variables: []
      height: 90
      id: check
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(body: str, status_code: int) -> dict:
              # news 판정: new(처음) · duplicate(이미 저장) · similar(비슷한 기사) + summarized(앞 시간 요약에 이미 씀) + use(이번에 씀)
              try:
                  res = json.loads(body or "{}")
              except ValueError:
                  res = {}
              items = res.get("items") or []
              fetch = [i["url"] for i in items if i.get("use") and i.get("status") in ("new", "similar") and i.get("url")]
              reuse = [i for i in items if i.get("use") and i.get("status") == "duplicate" and i.get("stored")]
              skipped = sum(1 for i in items if not i.get("use"))
              pages = {"urls": fetch or ["about:blank"], "wait_until": "domcontentloaded", "wait_ms": 800, "max_chars": 3000}
              note = (f"새 기사 {len(fetch)}건, 저장돼 있던 기사 {len(reuse)}건, 앞 시간과 겹쳐 뺀 기사 {skipped}건"
                      + ("" if status_code == 200 else f" (news 판정 실패 {status_code}: {str(body)[:200]})"))
              titles = {i["url"]: i.get("title") or "" for i in items}
              return {"pages_body": json.dumps(pages), "reuse": json.dumps(reuse, ensure_ascii=False),
                      "titles": json.dumps(titles, ensure_ascii=False), "note": note}
        code_language: python3
        desc: 새 기사만 본문을 연다
        outputs:
          pages_body:
            children: null
            type: string
          reuse:
            children: null
            type: string
          titles:
            children: null
            type: string
          note:
            children: null
            type: string
        selected: false
        title: 열 기사 정하기
        type: code
        variables:
        - value_selector:
          - check
          - body
          variable: body
        - value_selector:
          - check
          - status_code
          variable: status_code

    - data:
        code: |
          import json
          import re


          def main(text: str, article_ids: str, new_count: str, report: str, sources: str) -> dict:
              # 생각(think) 블록이 섞여 나오면 뺀다. 숨김 표시는 화면에 안 보이고 news 가 읽어 기사 연결에 쓴다.
              # 순서: LLM 한눈에 → 버핏 필터 신호(5항목·DART 대조, news 가 만든 글) → 걸러낸 기사 → 출처
              body = re.sub(r"<think>.*?</think>", "", text or "", flags=re.S).strip()
              try:
                  src = json.loads(sources or "[]")
              except ValueError:
                  src = []
              links = [f"- [기사{n}] [{(a.get('title') or '기사')[:80]}]({a.get('url')})" if (a.get("url") or "").startswith("http")
                       else f"- [기사{n}] {(a.get('title') or '')[:80]}" for n, a in enumerate(src, 1)]
              parts = [body, (report or "").strip()]
              if links:
                  parts.append("### 🔗 출처\n" + "\n".join(links))
              ids = ",".join(x for x in (article_ids or "").replace(" ", "").split(",") if x.isdigit())
              out = "\n\n".join(p for p in parts if p)
              return {"result": f"{out}\n\n<!-- news-meta article_ids={ids} new_count={(new_count or '0').strip()} -->"}
        code_language: python3
        desc: 한눈에 + 버핏 필터 신호·걸러낸 기사 + 출처를 글 하나로, 쓴 기사 번호는 글 끝 숨김 표시로 news 에 넘긴다
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 결과 정리
        type: code
        variables:
        - value_selector:
          - llm
          - text
          variable: text
        - value_selector:
          - merge
          - article_ids
          variable: article_ids
        - value_selector:
          - merge
          - new_count
          variable: new_count
        - value_selector:
          - bparse
          - report
          variable: report
        - value_selector:
          - merge
          - sources
          variable: sources

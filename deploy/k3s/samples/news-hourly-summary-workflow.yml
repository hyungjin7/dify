      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(save_body: str, save_status: int, fetched: str, reuse: str, note: str, bad: str) -> dict:
              # 요약에 쓸 기사 = 이번에 새로 저장한 기사 + 저장돼 있었지만 앞 시간 요약에 안 쓴 기사. id 는 시간별 요약에 남긴다
              try:
                  saved = (json.loads(save_body or "{}") or {}).get("saved") or []
              except ValueError:
                  saved = []
              id_of = {s["url"]: s["id"] for s in saved if s.get("id")}
              try:
                  fetched_l = json.loads(fetched or "[]")
              except ValueError:
                  fetched_l = []
              try:
                  reuse_l = json.loads(reuse or "[]")
              except ValueError:
                  reuse_l = []
              arts = []
              for f in fetched_l:
                  if f["url"] in id_of:
                      arts.append({"id": id_of[f["url"]], "title": f["title"], "url": f["url"], "content": f["content"]})
              for r in reuse_l:
                  s = r.get("stored") or {}
                  if s.get("id"):
                      arts.append({"id": s["id"], "title": s.get("title") or r.get("title"), "url": s.get("url") or r.get("url"),
                                   "content": s.get("content") or "", "press": s.get("press")})
              parts = []
              for n, a in enumerate(arts, 1):
                  parts.append(f"[기사{n}] {a['title']}\n주소: {a['url']}\n{(a['content'] or '')[:2500]}")
              msg = f"{note}. 본문 못 읽음 {bad}건. 요약 대상 {len(arts)}건" + ("" if save_status == 200 else f" (저장 실패 {save_status})")
              return {"text": "\n\n".join(parts)[:40000], "article_ids": ",".join(str(a["id"]) for a in arts),
                      "new_count": str(len(id_of)), "note": msg,
                      "sources": json.dumps([{"title": a["title"] or "", "url": a["url"] or ""} for a in arts], ensure_ascii=False)}
        code_language: python3
        desc: 새로 저장한 기사 + 앞 시간에 안 쓴 저장 기사
        outputs:
          text:
            children: null
            type: string
          article_ids:
            children: null
            type: string
          new_count:
            children: null
            type: string
          note:
            children: null
            type: string
          sources:
            children: null
            type: string

          import json


          def main(body: str, status: int) -> dict:
              # 필터가 실패해도 요약은 낸다(실패했다고 적는다)
              try:
                  d = json.loads(body or "{}") or {}
              except ValueError:
                  d = {}
              if not d.get("report"):
                  why = f"버핏 필터 실패(HTTP {status})" if status else "버핏 필터 응답 없음(시간 초과 등)"
                  return {"report": f"### 🧭 버핏 필터 신호\n{why} — 이번 시간은 신호를 판정하지 못함.",
                          "signals": "(필터 실패)", "tally": why}
              return {"report": d["report"], "signals": d.get("signals_text") or "(신호 없음)", "tally": d.get("tally") or ""}
        code_language: python3

    - data:
        code: |
          import json


          def main(body: str, titles: str) -> dict:
              # ego 로 받은 본문 → news 에 저장할 목록
              try:
                  res = json.loads(body or "{}")
              except ValueError:
                  res = {}
              try:
                  tmap = json.loads(titles or "{}")
              except ValueError:
                  tmap = {}
              items, bad = [], 0
              for it in res.get("items") or []:
                  url = it.get("url") or ""
                  if url == "about:blank":
                      continue
                  text = (it.get("text") or "").strip()
                  if it.get("error") or len(text) < 200:
                      bad += 1
                      continue
                  items.append({"url": url, "title": tmap.get(url) or it.get("title") or "", "content": text})
              return {"save_body": json.dumps({"source": "Naver 주요뉴스", "items": items}, ensure_ascii=False),
                      "fetched": json.dumps(items, ensure_ascii=False), "bad": str(bad)}

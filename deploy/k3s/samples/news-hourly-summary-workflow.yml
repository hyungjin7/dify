          - save
          - body
          variable: save_body
        - value_selector:
          - save
          - status_code
          variable: save_status
        - value_selector:
          - prep
          - fetched
          variable: fetched
        - value_selector:
          - plan
          - reuse
          variable: reuse
        - value_selector:
          - plan
          - note
          variable: note
        - value_selector:
          - prep
          - bad
          variable: bad
      height: 90
      id: merge
      position:
        x: 2480
        y: 280
      positionAbsolute:
        x: 2480
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 시간별 요약
        model:
          completion_params:
            max_tokens: 4000
            temperature: 0.3
          mode: chat
          name: gemma-4-E4B-it-MLX-8bit
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys-prompt
          role: system
          text: |-
            너는 증권 뉴스 편집자다. 아래 <기사> 는 네이버 증권 주요뉴스 중 {{#start.slot#}} 기준으로 **앞 시간 요약에 아직 안 나온** 기사들의 본문 앞부분이다.
            규칙:
            - 맨 위 첫 줄은 "## {{#start.slot#}} 뉴스 요약" 으로 쓴다.
            - 기사 본문만 근거로 한국어로 쓴다. 없는 내용은 지어내지 않는다. 숫자(지수·환율·금리·주가·실적)는 본문 그대로 옮긴다.
            - 문장 끝에 근거 [기사N] 을 붙인다. 같은 사건을 다룬 기사는 한 줄로 묶고 근거를 함께 단다.
            - 형식:
              1) 이번 시간 한눈에(3줄)
              2) 주제별 — 거시·환율·금리 / 국내 증시 / 해외 증시 / 산업·업종 / 종목 (기사 없는 묶음은 생략). 항목마다 1~2줄 + [기사N]
              3) 출처: [기사N] 제목 · 주소
            - <기사> 가 비었으면 "이번 시간에는 새 주요뉴스가 없습니다." 한 줄과 아래 참고만 쓴다.
            - 사용자 요청이 있으면 그 주제 위주로 쓴다: {{#start.request#}}

            참고: {{#merge.note#}}

            <기사>
            {{#merge.text#}}
            </기사>
        - id: user-prompt
          role: user
          text: '{{#start.slot#}} 주요뉴스 요약'
        selected: false
        title: 요약(LLM)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 90
      id: llm
      position:
        x: 2780
        y: 280
      positionAbsolute:
        x: 2780
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import re


          def main(text: str, article_ids: str, new_count: str) -> dict:
              # 생각(think) 블록이 섞여 나오면 뺀다. 숨김 표시는 화면에 안 보이고 news 가 읽어 기사 연결에 쓴다.
              body = re.sub(r"<think>.*?</think>", "", text or "", flags=re.S).strip()
              ids = ",".join(x for x in (article_ids or "").replace(" ", "").split(",") if x.isdigit())
              return {"result": f"{body}\n\n<!-- news-meta article_ids={ids} new_count={(new_count or '0').strip()} -->"}
        code_language: python3
        desc: 요약 글 하나로 내보내고, 쓴 기사 번호는 글 끝 숨김 표시로 news 에 넘긴다
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 결과 정리
        type: code
        variables:
        - value_selector:
          - llm
          - text
          variable: text
        - value_selector:
          - merge
          - article_ids
          variable: article_ids
        - value_selector:
          - merge

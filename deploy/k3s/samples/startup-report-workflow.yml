    - data:
        code: |
          import json
          import re

          LIMIT = 600


          def main(body: str, status: int, sources: str, item_ids: str, tally: str, count: str, report_id: str, focus: str,
                   slug: str) -> dict:
              try:
                  d = json.loads(body or "{}") or {}
              except ValueError:
                  d = {}
              rid = str(report_id or "").strip()
              rid = int(rid) if rid.isdigit() else None
              text = re.sub(r"<think>.*?</think>", "", d.get("text") or "", flags=re.S).strip()
              if status != 200 or not text or int(count or 0) == 0:
                  why = d.get("error") or ("분석된 자료 없음" if int(count or 0) == 0 else
                                           ("응답 없음(시간 초과 등)" if not status else f"HTTP {status}"))
                  msg = f"⚠️ 신규 창업아이템 보고서 실패: {why} · {tally}"
                  return {"result": msg, "chars": "0", "ok": "false",
                          "save_body": json.dumps({"report_id": rid, "ok": False, "error": msg, "report": ""}, ensure_ascii=False)}
              try:
                  src = json.loads(sources or "{}")
              except ValueError:
                  src = {}
              # LLM 이 쓴 "참고 및 출처" 는 버리고, 본문에 실제로 인용한 [자료N] 만 저장된 값으로 다시 쓴다(지어낸 출처 차단)
              m = re.search(r"^[#>*\s]*참고\s*및\s*출처.*\Z", text, flags=re.M | re.S)
              if m:
                  text = text[:m.start()].rstrip()
              cited = sorted({int(x) for g in re.findall(r"\[\s*자료\s*([\d,\s자료]+)", text) for x in re.findall(r"\d+", g)
                              if str(int(x)) in src})
              lines = []
              for n in cited:
                  s = src[str(n)]
                  t = (s.get("title") or "자료").replace("[", "(").replace("]", ")")
                  lines.append(f"- [자료{n}] {s.get('kind')} · {s.get('site')} · {s.get('date')} · [{t}]({s.get('url')})")
              tail = "참고 및 출처:\n" + ("\n".join(lines) if lines else "- 확인 필요 (본문에 인용한 자료 없음)")
              plain = "".join(l for l in text.splitlines() if not l.lstrip().startswith(("|", "#", "---", "작성일")))
              size = len(re.sub(r"\s", "", plain))
              warn = f"본문 {size}자 — 목표 {LIMIT}자 초과" if size > LIMIT else ""
              out = f"{text}\n\n{tail}" + (f"\n\n> ⚠️ {warn}" if warn else "")
              save = {"report_id": rid, "ok": True, "focus": focus, "report": out, "item_ids": json.loads(item_ids or "[]"),
                      "cited": len(cited), "chars": size, "warning": warn, "template_slug": slug}
              return {"result": out, "chars": str(size), "ok": "true", "save_body": json.dumps(save, ensure_ascii=False)}
        code_language: python3
        desc: 출처를 저장된 자료(주소·사이트·날짜)로 다시 쓰고 분량(600자)을 잰다
        outputs:
          result:
            children: null
            type: string
          chars:
            children: null
            type: string
          ok:
            children: null
            type: string
          save_body:
            children: null
            type: string

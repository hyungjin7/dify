      width: 244
      data:
        type: knowledge-retrieval
        title: Argo CD 찾기
        desc: ''
        selected: false
        dataset_ids:
        - __DS:기술문서 · Argo CD__
        retrieval_mode: multiple
        query_variable_selector:
        - sys
        - query
        multiple_retrieval_config:
          top_k: 6
          reranking_enable: false
          reranking_mode: reranking_model
    - id: kr_helm
      height: 92
      position:
        x: 680
        y: 600
      positionAbsolute:
        x: 680
        y: 600
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: knowledge-retrieval
        title: Helm 찾기
        desc: ''
        selected: false
        dataset_ids:
        - __DS:기술문서 · Helm__
        retrieval_mode: multiple
        query_variable_selector:
        - sys
        - query
        multiple_retrieval_config:
          top_k: 6
          reranking_enable: false
          reranking_mode: reranking_model
    - id: kr_all
      height: 92
      position:
        x: 680
        y: 720
      positionAbsolute:
        x: 680
        y: 720
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: knowledge-retrieval
        title: 전체 찾기
        desc: ''
        selected: false
        dataset_ids:
        - __DS:기술문서 · Kubernetes__
        - __DS:기술문서 · PostgreSQL__
        - __DS:기술문서 · Traefik__
        - __DS:기술문서 · Argo CD__
        - __DS:기술문서 · Helm__
        retrieval_mode: multiple
        query_variable_selector:
        - sys
        - query
        multiple_retrieval_config:
          top_k: 6
          reranking_enable: false
          reranking_mode: reranking_model
    - id: agg
      height: 200
      position:
        x: 980
        y: 400
      positionAbsolute:
        x: 980
        y: 400
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: variable-aggregator
        title: 찾은 문단 모으기
        desc: ''
        selected: false
        output_type: array[object]
        variables:
        - - kr_kubernetes
          - result
        - - kr_postgresql
          - result
        - - kr_traefik
          - result
        - - kr_argocd
          - result
        - - kr_helm
          - result
        - - kr_all
          - result
    - id: llm
      height: 98
      position:
        x: 1280
        y: 400
      positionAbsolute:
        x: 1280
        y: 400
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: llm
        title: 답변(LLM)
        desc: 찾은 문서만 근거로 답한다
        selected: false
        context:
          enabled: true
          variable_selector:
          - agg
          - output
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            max_tokens: 3000
            temperature: 0.2
          mode: chat
          name: gemma-4-E4B-it-MLX-8bit
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys-prompt
          role: system
          text: '너는 인프라 기술 문서 안내원이다. 아래 <문서> 는 Kubernetes·PostgreSQL·Traefik·Argo CD·Helm 공식 문서(영문)에서 질문으로 찾은 문단들이다.

            규칙:

            - <문서> 에 있는 내용만 근거로 한국어로 답한다. 없으면 "문서에서 찾지 못했습니다"라고 말하고 짐작하지 않는다.

            - 명령어·설정 키·YAML·SQL·옵션 이름은 번역하지 않고 원문 그대로 코드 블록으로 쓴다.

            - 버전에 따라 다른 내용이면 문서에 적힌 버전을 함께 쓴다.

            - 출처 목록은 쓰지 않는다(화면이 찾은 문서 제목·원문 링크를 따로 보여 준다).


            <문서>

            {{#context#}}

            </문서>'
        variables: []
        vision:
          enabled: false
    - id: answer
      height: 103
      position:
        x: 1580
        y: 400
      positionAbsolute:
        x: 1580
        y: 400
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: answer
        title: 답변
        desc: ''
        selected: false
        answer: '{{#llm.text#}}'
        variables: []
    viewport:
      x: 0
      y: 0
      zoom: 0.7

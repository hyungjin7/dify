# 기술 문서 묻기(2026-11-18 사용자 요청: NCP 가이드처럼 Kubernetes·PostgreSQL·Traefik·Argo CD·Helm 공식 문서 추가).
# 문서마다 지식 베이스 "기술문서 · <이름>"(samples/tech_docs_to_dify.py, CronJob tech-docs-sync)이 따로 있고,
# 시작 입력 scope(kubernetes|postgresql|traefik|argocd|helm, 비우면 all = 다섯 개 함께)로 찾을 곳을 고른다.
# 올리기: SAVE_APP_KEY=tech-docs-dify-app INPUTS='{"scope":"kubernetes"}' python3 deploy/k3s/samples/install_app.py deploy/k3s/samples/tech-docs-chat.yml "Deployment 롤링 업데이트 설정"
# install_app.py 가 __DS:<지식 베이스 이름>__ 를 실제 id 로 바꾸고, 앱 키를 bbb Secret 으로 저장한다.
app:
  description: Kubernetes·PostgreSQL·Traefik·Argo CD·Helm 공식 문서만 찾아 답하는 챗봇(다른 지식과 분리)
  icon: 📚
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: 기술 문서 묻기
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-source-route
      source: start
      sourceHandle: source
      target: route
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: if-else
    - id: route-kubernetes-kr_kubernetes
      source: route
      sourceHandle: kubernetes
      target: kr_kubernetes
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: route-postgresql-kr_postgresql
      source: route
      sourceHandle: postgresql
      target: kr_postgresql
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: route-traefik-kr_traefik
      source: route
      sourceHandle: traefik
      target: kr_traefik
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: route-argocd-kr_argocd
      source: route
      sourceHandle: argocd
      target: kr_argocd
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: route-helm-kr_helm
      source: route
      sourceHandle: helm
      target: kr_helm
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: route-false-kr_all
      source: route
      sourceHandle: 'false'
      target: kr_all
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: kr_kubernetes-source-agg
      source: kr_kubernetes
      sourceHandle: source
      target: agg
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: variable-aggregator
    - id: kr_postgresql-source-agg
      source: kr_postgresql
      sourceHandle: source
      target: agg
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: variable-aggregator
    - id: kr_traefik-source-agg
      source: kr_traefik
      sourceHandle: source
      target: agg
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: variable-aggregator
    - id: kr_argocd-source-agg
      source: kr_argocd
      sourceHandle: source
      target: agg
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: variable-aggregator
    - id: kr_helm-source-agg
      source: kr_helm
      sourceHandle: source
      target: agg
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: variable-aggregator
    - id: kr_all-source-agg
      source: kr_all
      sourceHandle: source
      target: agg
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: variable-aggregator
    - id: agg-source-llm
      source: agg
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: variable-aggregator
        targetType: llm
    - id: llm-source-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
    nodes:
    - id: start
      height: 90
      position:
        x: 80
        y: 400
      positionAbsolute:
        x: 80
        y: 400
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: start
        title: 시작
        desc: 질문 + 문서 범위(비우면 전체)
        selected: false
        variables:
        - label: 문서 범위
          variable: scope
          type: select
          required: false
          max_length: 48
          options:
          - all
          - kubernetes
          - postgresql
          - traefik
          - argocd
          - helm
    - id: route
      height: 300
      position:
        x: 380
        y: 400
      positionAbsolute:
        x: 380
        y: 400
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: if-else
        title: 범위 고르기
        desc: ''
        selected: false
        cases:
        - case_id: kubernetes
          id: kubernetes
          logical_operator: and
          conditions:
          - id: c-kubernetes
            comparison_operator: is
            value: kubernetes
            varType: string
            variable_selector:
            - start
            - scope
        - case_id: postgresql
          id: postgresql
          logical_operator: and
          conditions:
          - id: c-postgresql
            comparison_operator: is
            value: postgresql
            varType: string
            variable_selector:
            - start
            - scope
        - case_id: traefik
          id: traefik
          logical_operator: and
          conditions:
          - id: c-traefik
            comparison_operator: is
            value: traefik
            varType: string
            variable_selector:
            - start
            - scope
        - case_id: argocd
          id: argocd
          logical_operator: and
          conditions:
          - id: c-argocd
            comparison_operator: is
            value: argocd
            varType: string
            variable_selector:
            - start
            - scope
        - case_id: helm
          id: helm
          logical_operator: and
          conditions:
          - id: c-helm
            comparison_operator: is
            value: helm
            varType: string
            variable_selector:
            - start
            - scope
    - id: kr_kubernetes
      height: 92
      position:
        x: 680
        y: 120
      positionAbsolute:
        x: 680
        y: 120
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      data:
        type: knowledge-retrieval
        title: Kubernetes 찾기
        desc: ''
        selected: false
        dataset_ids:
        - __DS:기술문서 · Kubernetes__
        retrieval_mode: multiple
        query_variable_selector:
        - sys
        - query
        multiple_retrieval_config:
          top_k: 6
          reranking_enable: false
          reranking_mode: reranking_model
    - id: kr_postgresql

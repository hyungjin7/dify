        timeout:
          max_connect_timeout: 10
          max_read_timeout: 300
          max_write_timeout: 30
        title: YouTube 검색 4개(Ego Lite)
        type: http-request
        url: http://ego.bbb-namespace.svc.cluster.local:8017/api/v1/ego/pages
        variables: []
        error_strategy: default-value
        default_value: *id001
      height: 90

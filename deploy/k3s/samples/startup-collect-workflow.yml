    - data:
        code: |
          import json
          from datetime import datetime, timedelta, timezone
          from urllib.parse import quote_plus

          # 검색어(설계서 ①): 개발 민주화·수작업 자동화·AI 창업 기회 세 축, 한국어·영어.
          # 2026-11-25 사용자 요청 "검색어를 더 다양하게 많이": 업종 × 관점을 조합해 검색어를 만들고
          #   수집 차례마다 다음 묶음을 쓴다(같은 검색어는 한 바퀴 돈 뒤에야 다시 나옴).
          #   Google = 업종 24 × 관점 8 × 한국어·영어 = 384개(8개씩 48번, 하루 4번이면 12일에 한 바퀴)
          #   YouTube = 업종 24 × 관점 4 = 96개(4개씩 24번, 6일에 한 바퀴). 업종·관점은 아래 줄에 더하면 바로 늘어난다.
          import random
          INDUSTRY = [("회계 정산", "accounting reconciliation"), ("세무 신고", "tax filing"), ("물류 배송", "logistics delivery"),
                      ("화물 운송", "freight trucking"), ("영업 B2B", "B2B sales"), ("고객 상담", "customer support"),
                      ("채용 인사", "recruiting HR"), ("법률 계약", "legal contracts"), ("마케팅 콘텐츠", "marketing content"),
                      ("이커머스 운영", "ecommerce operations"), ("제조 품질", "manufacturing quality"), ("건설 현장", "construction"),
                      ("병원 의료 행정", "healthcare admin"), ("교육 학원", "education tutoring"), ("부동산 중개", "real estate"),
                      ("보험 청구", "insurance claims"), ("금융 투자 리서치", "investment research"), ("소프트웨어 개발", "software development"),
                      ("데이터 분석", "data analytics"), ("문서 작성", "document drafting"), ("회의 기록", "meeting notes"),
                      ("구매 조달", "procurement"), ("IT 운영 클라우드", "IT ops cloud"), ("소상공인 매장", "small business retail")]
          ANGLE_KO = ["AI 자동화 스타트업", "AI 에이전트 서비스 출시", "AI 도입 사례 비용 절감", "AI SaaS 시장 규모",
                      "AI 스타트업 투자 유치", "AI 1인 창업", "생성형 AI 생산성 효과", "AI 솔루션 경쟁사"]
          ANGLE_EN = ["AI automation startup", "AI agent launch", "AI adoption case study cost savings", "AI SaaS market size",
                      "AI startup funding round", "solo founder AI", "generative AI productivity study", "AI tool competitors"]
          YT_ANGLE = ["AI 자동화 창업", "AI agent business", "AI 업무 자동화 사례", "AI SaaS idea"]


          def _cycle(items, seed):
              items = list(items)
              random.Random(seed).shuffle(items)   # 순서만 섞고 늘 같은 순서(차례가 이어지게)
              return items


          GOOGLE_ALL = _cycle([f"{ko} {a}" for ko, _ in INDUSTRY for a in ANGLE_KO]
                              + [f"{en} {a}" for _, en in INDUSTRY for a in ANGLE_EN], 25)
          YOUTUBE_ALL = _cycle([f"{(ko if i % 2 == 0 else en)} {a}" for ko, en in INDUSTRY for i, a in enumerate(YT_ANGLE)], 26)
          SLOT = {7: 0, 8: 1, 13: 2, 14: 3}   # 하루 수집 4번(7·8·13·14시), 그 밖(지금 수집)은 시각으로


          def _take(items, turn, n):
              start = (turn * n) % len(items)
              return [items[(start + k) % len(items)] for k in range(n)]


          def main(page: str) -> dict:
              p2 = str(page or "1").strip() == "2"
              now = datetime.now(timezone(timedelta(hours=9)))
              turn = now.toordinal() * 4 + SLOT.get(now.hour, now.hour)
              GOOGLE, YOUTUBE = _take(GOOGLE_ALL, turn, 8), _take(YOUTUBE_ALL, turn, 4)
              # Google: 최근 1달(tbs=qdr:m), 2쪽 = start=10. YouTube: 이번 달(sp=EgIIBA), 2쪽 = 업로드 날짜순(sp=CAI)
              g = [f"https://www.google.com/search?q={quote_plus(q)}&hl=ko&num=20&tbs=qdr:m" + ("&start=10" if p2 else "")
                   for q in GOOGLE]
              y = [f"https://www.youtube.com/results?search_query={quote_plus(q)}&sp=" + ("CAI%253D" if p2 else "EgIIBA%253D%253D")
                   for q in YOUTUBE]
              body = lambda urls: json.dumps({"urls": urls, "wait_until": "domcontentloaded", "wait_ms": 2500,
                                              "max_chars": 200, "include_links": True}, ensure_ascii=False)
              return {"web_body": body(g), "yt_body": body(y), "queries": json.dumps(GOOGLE + YOUTUBE, ensure_ascii=False),
                      "page_used": "2" if p2 else "1"}
        code_language: python3
        desc: 업종×관점 검색어(Google 384·YouTube 96) 중 이번 차례 Google 8 + YouTube 4 → Ego Lite 로 열 주소(2쪽이면 다음 결과)

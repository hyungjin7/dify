    - data:
        code: |
          import json


          def main(body: str, web: str, run_id: str, page: str, queries: str, count: str, note: str, note2: str) -> dict:
              try:
                  got = {x.get("url"): x for x in (json.loads(body or "{}") or {}).get("items") or []}
              except ValueError:
                  got = {}
              items = []
              for w in json.loads(web or "[]"):
                  it = got.get(w["url"]) or {}
                  text = (it.get("text") or "").strip()
                  if it.get("error") or not text:
                      continue
                  items.append({"kind": "web", "query": w.get("query") or "", "url": w["url"],
                                "title": (it.get("title") or w.get("title") or "")[:300], "site": w.get("site") or "", "text": text})
              rid = str(run_id or "").strip()
              return {"save_body": json.dumps({"run_id": int(rid) if rid.isdigit() else None, "page": int(page or 1),
                                               "queries": json.loads(queries or "[]"), "candidates": int(count or 0),
                                               "note": f"{note} · {note2}", "items": items}, ensure_ascii=False),
                      "n": str(len(items))}

    - data:
        code: |
          import json


          def main(check: str, status: int, cands: str) -> dict:
              try:
                  new = set((json.loads(check or "{}") or {}).get("new") or [])
              except ValueError:
                  new = set()
              c = json.loads(cands or "{}")
              if status != 200:          # 중복 확인이 안 되면 다 연다(저장할 때 주소로 한 번 더 거른다)
                  new = {x["url"] for x in c.get("web", []) + c.get("yt", [])}
              web = [x for x in c.get("web", []) if x["url"] in new]
              yt = [x for x in c.get("yt", []) if x["url"] in new]
              return {"pages_body": json.dumps({"urls": [x["url"] for x in web] or ["about:blank"], "wait_until": "domcontentloaded",
                                                "wait_ms": 1200, "max_chars": 3500}, ensure_ascii=False),
                      "tr_body": json.dumps({"video_ids": [x["id"] for x in yt] or ["none0000000"], "langs": ["ko", "en"],
                                             "max_chars": 5000}),
                      "web": json.dumps(web, ensure_ascii=False), "yt": json.dumps(yt, ensure_ascii=False),
                      "note": f"새 자료 웹 {len(web)} · 영상 {len(yt)}"}
        code_language: python3

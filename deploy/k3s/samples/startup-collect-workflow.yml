      width: 244
    - data:
        code: |
          import json
          import re
          from urllib.parse import parse_qs, urlparse

          SKIP = re.compile(r"(^|\.)(google\.[a-z.]+|gstatic\.com|googleusercontent\.com|googleadservices\.com|youtube\.com|"
                            r"youtu\.be|blogger\.com|webcache\.googleusercontent\.com)$")
          VID = re.compile(r"[?&]v=([A-Za-z0-9_-]{11})")
          WEB_MAX, YT_MAX, PER_SITE = 60, 24, 3


          def pages(body):
              try:
                  return (json.loads(body or "{}") or {}).get("items") or []
              except ValueError:
                  return []


          def real(href):
              p = urlparse(href)
              if p.path == "/url" and "q" in parse_qs(p.query):   # Google 이 /url?q=<진짜 주소> 로 감싸는 경우
                  return parse_qs(p.query)["q"][0]
              return href


          def query_of(url):
              q = parse_qs(urlparse(url).query)
              return (q.get("q") or q.get("search_query") or [""])[0]


          def main(web: str, yt: str) -> dict:
              web_c, sites, seen = [], {}, set()
              g_ok = y_ok = 0
              rounds = [[(query_of(p.get("url") or ""), l) for l in (p.get("links") or [])] for p in pages(web)]
              g_ok = sum(1 for r in rounds if r)
              # 검색어마다 위에서부터 돌아가며 한 개씩 → 한 검색어에 몰리지 않는다
              for i in range(max([len(r) for r in rounds] or [0])):
                  for r in rounds:
                      if i >= len(r) or len(web_c) >= WEB_MAX:
                          continue
                      q, l = r[i]
                      href = real(str(l.get("href") or "").split("#")[0])
                      text = " ".join(str(l.get("text") or "").split())
                      host = (urlparse(href).hostname or "").lower().removeprefix("www.")
                      if not href.startswith("http") or not host or SKIP.search(host) or len(text) < 10 or href in seen:
                          continue
                      if href.lower().endswith((".pdf", ".zip", ".hwp")) or sites.get(host, 0) >= PER_SITE:
                          continue
                      sites[host] = sites.get(host, 0) + 1
                      seen.add(href)
                      web_c.append({"url": href, "query": q, "title": text[:200], "site": host})
              vids = []
              for p in pages(yt):
                  q = query_of(p.get("url") or "")
                  links = p.get("links") or []
                  y_ok += 1 if links else 0
                  for l in links:
                      href = str(l.get("href") or "")
                      m = VID.search(href)
                      if not m or "/shorts/" in href or any(v["id"] == m.group(1) for v in vids):
                          continue
                      vids.append({"id": m.group(1), "query": q, "url": f"https://www.youtube.com/watch?v={m.group(1)}"})
                      if len(vids) >= YT_MAX:
                          break
              cands = web_c + vids
              return {"check_body": json.dumps({"urls": [x["url"] for x in cands]}, ensure_ascii=False),
                      "cands": json.dumps({"web": web_c, "yt": vids}, ensure_ascii=False),
                      "note": f"Google 검색 {g_ok}/8 · YouTube 검색 {y_ok}/4 · 후보 웹 {len(web_c)} · 영상 {len(vids)}",
                      "count": str(len(cands))}
        code_language: python3
        desc: 웹 최대 60개(사이트당 3개), 영상 최대 24개(쇼츠 제외)
        outputs:
          check_body:
            children: null
            type: string
          cands:
            children: null
            type: string
          note:
            children: null
            type: string
          count:
            children: null
            type: string
        selected: false

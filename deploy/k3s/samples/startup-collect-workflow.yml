    - data:
        code: |
          import json


          def load(b):
              try:
                  return json.loads(b or "{}") or {}
              except ValueError:
                  return {}


          def main(w: str, ws: int, y: str, ys: int, note: str, note2: str) -> dict:
              a, b = load(w), load(y)
              saved = int(a.get("saved") or 0) + int(b.get("saved") or 0)
              short = int(a.get("short_skipped") or 0) + int(b.get("short_skipped") or 0)
              fail = [n for n, s in (("웹 저장", ws), ("영상 저장", ys)) if s != 200]
              line = (f"저장 {saved}건(짧아서 뺌 {short}) · {note} · {note2}" + (f" · 목표 50건 중 부족 {50 - saved}" if saved < 50 else "")
                      + (f" · 실패: {', '.join(fail)}" if fail else ""))
              return {"result": line, "saved": str(saved)}
        code_language: python3
        desc: 저장 건수·부족 건수
        outputs:
          result:
            children: null
            type: string
          saved:
            children: null
            type: string

          max_read_timeout: 30
          max_write_timeout: 10
        variables: []
    - id: source
      type: custom
      position:
        x: 1280
        y: 280
      positionAbsolute:
        x: 1280
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 54

# 말씀 스와이프(easybible) 구절 공부 v2 (2026-11-24 사용자 요청, 같은 날 "주소만 넣으면 되게"·"비우면 랜덤").
# 구절 주소 하나만 넣는다(창세기 1장 1절, 창 1:1, 요 3:16 / 비우면 랜덤). 본문은 AI 가 아니라
#   원본 파일(github yuhwan/bible-krv 고정 커밋)에서 꺼내고 파일 지문(SHA-256)을 앱과 같은 값으로 확인한다.
#   두 출처가 다른 절·자리표시 절은 쓰지 않는다. AI 는 설명 7가지(JSON 글자 text)만 쓴다.
# 앱이 보내는 verse_text·context·translation 은 받아도 쓰지 않는다(본문은 항상 원본 파일).
# 올리기: SAVE_APP_KEY=easybible-dify-app ENV_FILE=~/projects/easybible/.env.local \
#   INPUTS='{"reference":"창세기 1장 1절"}' python3 deploy/k3s/samples/install_app.py deploy/k3s/samples/bible-study-workflow.yml
app:
  description: 구절 주소만 넣으면(비우면 랜덤) 원본에서 구절을 꺼내 AI 가 설명한다
  icon: 📖
  icon_background: '#E0F2FE'
  mode: workflow
  name: 말씀 스와이프 구절 공부
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-source-parse
      source: start
      sourceHandle: 'source'
      target: parse
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: code
    - id: parse-source-parse_ok
      source: parse
      sourceHandle: 'source'
      target: parse_ok
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: if-else
    - id: parse_ok-true-fetch
      source: parse_ok
      sourceHandle: 'true'
      target: fetch
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
    - id: parse_ok-false-end_parse
      source: parse_ok
      sourceHandle: 'false'
      target: end_parse
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: end
    - id: fetch-source-source
      source: fetch
      sourceHandle: 'source'
      target: source
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: http-request
        targetType: code
    - id: source-source-source_ok
      source: source
      sourceHandle: 'source'
      target: source_ok
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: if-else
    - id: source_ok-true-llm
      source: source_ok
      sourceHandle: 'true'
      target: llm
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
    - id: source_ok-false-end_source
      source: source_ok
      sourceHandle: 'false'
      target: end_source
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: end
    - id: llm-source-end
      source: llm
      sourceHandle: 'source'
      target: end
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 170
      width: 244
      data:
        type: start
        title: 시작
        desc: 구절 주소만 넣으면 돼요. 비우면 랜덤
        selected: false
        variables:
        - label: 구절 주소 (예 창세기 1장 1절, 요 3:16 / 비우면 랜덤)
          max_length: 100
          options: []
          required: false
          type: text-input
          variable: reference
        - label: (앱 전용) 구절 본문 - 비워 두세요
          max_length: 4000
          options: []
          required: false
          type: paragraph
          variable: verse_text
        - label: (앱 전용) 앞뒤 문맥 - 비워 두세요
          max_length: 8000
          options: []
          required: false
          type: paragraph
          variable: context
        - label: (앱 전용) 번역 - 비워 두세요
          max_length: 50
          options: []
          required: false
          type: text-input
          variable: translation
    - id: parse
      type: custom
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 54
      width: 244
      data:
        type: code
        title: 주소 읽기
        desc: 창세기 1장 1절 → 책·장·절, 비우면 랜덤 책
        selected: false
        code_language: python3
        code: |
          import random
          import re
          from urllib.parse import quote

          # 66권 [이름, 줄임말, 다른 이름…] (원본 books.json 순서)
          NAMES = [["창세기", "창"], ["출애굽기", "출"], ["레위기", "레"], ["민수기", "민"], ["신명기", "신"], ["여호수아", "수"], ["사사기", "삿"], ["룻기", "룻"], ["사무엘상", "삼상"], ["사무엘하", "삼하"], ["열왕기상", "왕상"], ["열왕기하", "왕하"], ["역대상", "대상"], ["역대하", "대하"], ["에스라", "스"], ["느헤미야", "느"], ["에스더", "에"], ["욥기", "욥"], ["시편", "시"], ["잠언", "잠"], ["전도서", "전"], ["아가", "아"], ["이사야", "사"], ["예레미야", "렘"], ["예레미야애가", "애"], ["에스겔", "겔"], ["다니엘", "단"], ["호세아", "호"], ["요엘", "욜"], ["아모스", "암"], ["오바댜", "옵"], ["요나", "욘"], ["미가", "미"], ["나훔", "나"], ["하박국", "합"], ["스바냐", "습"], ["학개", "학"], ["스가랴", "슥"], ["말라기", "말"], ["마태복음", "마", "마태"], ["마가복음", "막", "마가"], ["누가복음", "눅", "누가"], ["요한복음", "요", "요한"], ["사도행전", "행"], ["로마서", "롬"], ["고린도전서", "고전"], ["고린도후서", "고후"], ["갈라디아서", "갈"], ["에베소서", "엡"], ["빌립보서", "빌"], ["골로새서", "골"], ["데살로니가전서", "살전"], ["데살로니가후서", "살후"], ["디모데전서", "딤전"], ["디모데후서", "딤후"], ["디도서", "딛"], ["빌레몬서", "몬"], ["히브리서", "히"], ["야고보서", "약"], ["베드로전서", "벧전"], ["베드로후서", "벧후"], ["요한1서", "요일", "요한일서"], ["요한2서", "요이", "요한이서"], ["요한3서", "요삼", "요한삼서"], ["유다서", "유"], ["요한계시록", "계", "계시록"]]
          LOOKUP = {n: i for i, row in enumerate(NAMES) for n in row}
          BASE = "https://raw.githubusercontent.com/yuhwan/bible-krv/ba0395f18d6c0113544ed62230a5e7cfacc44a6a/"
          REF = re.compile(r"^(.+?)\s?(\d+)(?:\s?(?:장|편))?(?:\s?[:：.]\s?|\s)?(\d+)?(?:\s?절)?$")


          def main(reference: str) -> dict:
              s = re.sub(r"\s+", " ", (reference or "").strip())
              if not s or s in ("랜덤", "아무거나", "random"):
                  bi = random.randrange(66)   # 비우면 랜덤: 책을 고르고, 장·절은 원본을 받은 뒤 고른다
                  return {"ok": 1, "book_index": bi, "book": NAMES[bi][0], "chapter": 0, "verse": 0,
                          "url": BASE + quote(NAMES[bi][0] + ".json"), "error": ""}
              if s in LOOKUP:   # 책 이름만 쓰면 1장 1절
                  bi = LOOKUP[s]
                  return {"ok": 1, "book_index": bi, "book": NAMES[bi][0], "chapter": 1, "verse": 1,
                          "url": BASE + quote(NAMES[bi][0] + ".json"), "error": ""}
              m = REF.match(s)
              bi = LOOKUP.get(m.group(1).strip()) if m else None
              if bi is None:
                  return {"ok": 0, "book_index": -1, "book": "", "chapter": 0, "verse": 0, "url": "",
                          "error": '{"error": "주소를 못 읽었어요. 예: 창세기 1장 1절, 창 1:1, 요한복음 3:16 (비우면 랜덤)"}'}
              return {"ok": 1, "book_index": bi, "book": NAMES[bi][0], "chapter": int(m.group(2)),
                      "verse": int(m.group(3) or 1), "url": BASE + quote(NAMES[bi][0] + ".json"), "error": ""}

        variables:
        - variable: reference
          value_selector:
          - start
          - reference
        outputs:
          ok:
            type: number
            children: null
          book_index:
            type: number
            children: null
          book:
            type: string
            children: null
          chapter:
            type: number
            children: null
          verse:
            type: number
            children: null
          url:
            type: string
            children: null
          error:
            type: string
            children: null
    - id: parse_ok
      type: custom
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 126
      width: 244
      data:
        type: if-else
        title: 주소를 읽었나
        desc: ''
        selected: false
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: c-parse_ok
            comparison_operator: '='
            value: '1'
            varType: number
            variable_selector:
            - parse
            - ok

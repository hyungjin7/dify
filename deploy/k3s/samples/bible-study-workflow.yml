# 말씀 스와이프(easybible) 구절 공부 v3 (2026-11-24 사용자 결정: "본문=앱, 관련 구절=Dify 지식").
# 구절 주소 하나만 넣는다(창세기 1장 1절, 창 1:1, 요 3:16 / 비우면 랜덤).
#   본문 = 우리 앱 http://easybible.easybible.svc.cluster.local/api/verse(= bible.delvrio.com, 검문소 허용 목록에 있음) (원본 대조를 통과한 절만, 원본 문자열 그대로). GitHub 를 부르지 않는다.
#   관련 구절 후보 = Dify 지식 "성경 개역한글"(한 절 = 한 조각, bible_to_dify_knowledge.py 로 올림)에서 뜻으로 8개 찾기.
#   AI 는 설명 7가지(JSON 글자 text)만 쓴다. 앱은 관련 구절 주소를 원본으로 다시 확인한다.
#   AI 는 Dify LLM 노드가 아니라 bbb LLM Proxy 로 부른다(2026-11-25 사용자 결정, LLM Proxy 규칙):
#   agent /dify/llm/template + Prompt Templates slug easybible.study (프롬프트는 그 화면에서 고친다, 기록 = LLM 로그).
# 앱이 보내는 verse_text·context·translation 은 받아도 쓰지 않는다(본문은 항상 앱 API).
# 올리기(지식을 먼저 올린 뒤): SAVE_APP_KEY=easybible-dify-app SAVE_APP_KEY_NS=easybible \
#   INPUTS='{"reference":"창세기 1장 1절"}' python3 deploy/k3s/samples/install_app.py deploy/k3s/samples/bible-study-workflow.yml
app:
  description: 구절 주소만 넣으면(비우면 랜덤) 앱에서 원본 구절을 받고, 성경 지식에서 비슷한 구절을 찾아 AI 가 설명한다
  icon: 📖
  icon_background: '#E0F2FE'
  mode: workflow
  name: 말씀 스와이프 구절 공부
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: Prompt Templates slug (bbb agent)
    id: 3b1f6a20-7c4d-4e8a-9f21-5d0e6b7a8c11
    name: template_slug
    value: easybible.study
    value_type: string
  - description: bbb agent Dify 창구 키(Secret bbb-namespace/agent-dify-key)
    id: 4c2a7b31-8d5e-4f9b-a032-6e1f7c8b9d22
    name: agent_api_key
    value: ''
    value_type: secret
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: start-source-fetch
      source: start
      sourceHandle: 'source'
      target: fetch
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: fetch-source-source
      source: fetch
      sourceHandle: 'source'
      target: source
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: source-source-source_ok
      source: source
      sourceHandle: 'source'
      target: source_ok
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
      id: source_ok-true-kr
      source: source_ok
      sourceHandle: 'true'
      target: kr
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: end
      id: source_ok-false-end_source
      source: source_ok
      sourceHandle: 'false'
      target: end_source
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: code
      id: kr-source-prep
      source: kr
      sourceHandle: 'source'
      target: prep
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: prep-source-ask
      source: prep
      sourceHandle: 'source'
      target: ask
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: ask-source-done
      source: ask
      sourceHandle: 'source'
      target: done
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: code
        targetType: end
      id: done-source-end
      source: done
      sourceHandle: 'source'
      target: end
      targetHandle: target
      type: custom
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 170
      width: 244
      data:
        type: start
        title: 시작
        desc: 구절 주소만 넣으면 돼요. 비우면 랜덤
        selected: false
        variables:
        - label: 구절 주소 (예 창세기 1장 1절, 요 3:16 / 비우면 랜덤)
          max_length: 100
          options: []
          required: false
          type: text-input
          variable: reference
        - label: (앱 전용) 구절 본문 - 비워 두세요
          max_length: 4000
          options: []
          required: false
          type: paragraph
          variable: verse_text
        - label: (앱 전용) 앞뒤 문맥 - 비워 두세요
          max_length: 8000
          options: []
          required: false
          type: paragraph
          variable: context
        - label: (앱 전용) 번역 - 비워 두세요
          max_length: 50
          options: []
          required: false
          type: text-input
          variable: translation
    - id: fetch
      type: custom
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 130
      width: 244
      data:
        type: http-request
        title: 앱에서 원본 구절 받기
        desc: 앱 easybible /api/verse (클러스터 안 주소, 원본 대조 통과한 절만)
        selected: false
        method: get
        url: http://easybible.easybible.svc.cluster.local/api/verse
        authorization:
          type: no-auth
          config: null
        headers: ''
        params: 'ref:{{#start.reference#}}'
        body:
          type: none
          data: []
        ssl_verify: true
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
        variables: []
    - id: source
      type: custom
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 54
      width: 244
      data:
        type: code
        title: 받은 구절 읽기
        desc: 앱 답(JSON)에서 주소·본문·앞뒤 문맥 꺼내기(본문은 그대로)
        selected: false
        code_language: python3
        code: |
          import json


          def main(body: str, status_code: int) -> dict:
              empty = {"ok": 0, "reference": "", "verse_text": "", "context": ""}
              if status_code != 200 or not body:
                  return {**empty, "error": json.dumps({"error": f"앱(easybible)에서 구절을 못 받았어요(HTTP {status_code})"}, ensure_ascii=False)}
              d = json.loads(body)
              if not d.get("ok"):
                  return {**empty, "error": json.dumps({"error": d.get("error") or "구절을 못 찾았어요"}, ensure_ascii=False)}
              return {"ok": 1, "reference": d["reference"], "verse_text": d["verse_text"], "context": d.get("context", ""), "error": ""}

        variables:
        - variable: body
          value_selector:
          - fetch
          - body
        - variable: status_code
          value_selector:
          - fetch
          - status_code
        outputs:
          ok:
            type: number
            children: null
          reference:
            type: string
            children: null
          verse_text:
            type: string
            children: null
          context:
            type: string
            children: null
          error:
            type: string
            children: null
    - id: source_ok
      type: custom
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 126
      width: 244
      data:
        type: if-else
        title: 구절을 찾았나
        desc: ''
        selected: false
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: c-source_ok
            comparison_operator: '='
            value: '1'
            varType: number
            variable_selector:
            - source
            - ok
    - id: kr
      type: custom
      position:
        x: 1280
        y: 280
      positionAbsolute:
        x: 1280
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 92
      width: 244
      data:
        type: knowledge-retrieval
        title: 비슷한 구절 찾기
        desc: 지식 "성경 개역한글"에서 뜻이 비슷한 구절 8개(관련 구절 후보)
        selected: false
        dataset_ids:
        - __DS:성경 개역한글__
        query_variable_selector:
        - source
        - verse_text
        retrieval_mode: multiple
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: reranking_model
          top_k: 8
    - id: prep
      type: custom
      position:
        x: 1580
        y: 280
      positionAbsolute:
        x: 1580
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 54
      width: 244
      data:
        type: code
        title: AI 요청 만들기
        desc: 구절·문맥·비슷한 구절 후보를 Prompt Templates 변수로 묶는다
        selected: false
        code_language: python3
        code: |
          import json


          def main(reference: str, verse_text: str, context: str, kr: list, slug: str) -> dict:
              parts = []
              for x in kr or []:
                  c = (x or {}).get("content") if isinstance(x, dict) else str(x or "")
                  if c:
                      parts.append(str(c).strip())
              body = {"template_key": slug or "easybible.study", "subject": f"말씀 풀이 {reference}",
                      "variables": {"reference": reference, "verse_text": verse_text, "context": context or "",
                                    "candidates": "\n".join(parts) or "(없음)"}}
              return {"body": json.dumps(body, ensure_ascii=False)}

        variables:
        - variable: reference
          value_selector:
          - source
          - reference
        - variable: verse_text
          value_selector:
          - source
          - verse_text
        - variable: context
          value_selector:
          - source
          - context
        - variable: kr
          value_selector:
          - kr
          - result
        - variable: slug
          value_selector:
          - env
          - template_slug
        outputs:
          body:
            type: string
            children: null
    - id: ask
      type: custom
      position:
        x: 1880
        y: 280
      positionAbsolute:
        x: 1880
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 90
      width: 244
      data:
        type: http-request
        title: 말씀 풀이(AI, LLM Proxy)
        desc: bbb agent /dify/llm/template · slug easybible.study. 프롬프트는 Prompt Templates 화면에서 고친다
        selected: false
        method: post
        url: http://agent-service.bbb-namespace.svc.cluster.local:8000/dify/llm/template
        authorization:
          type: api-key
          config:
            type: bearer
            header: ''
            api_key: '{{#env.agent_api_key#}}'
        headers: Content-Type:application/json
        params: ''
        body:
          type: json
          data:
          - type: text
            value: '{{#prep.body#}}'
        ssl_verify: false
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 2000
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 300
          max_write_timeout: 30
        variables: []
    - id: done
      type: custom
      position:
        x: 2180
        y: 280
      positionAbsolute:
        x: 2180
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 54
      width: 244
      data:
        type: code
        title: AI 답 꺼내기
        desc: agent 답(JSON)의 text 만 꺼낸다. 실패면 error JSON
        selected: false
        code_language: python3
        code: |
          import json


          def main(body: str, status_code: int) -> dict:
              try:
                  d = json.loads(body or "{}") or {}
              except ValueError:
                  d = {}
              text = (d.get("text") or "").strip() if isinstance(d, dict) else ""
              if status_code != 200 or not text:
                  why = (d.get("error") if isinstance(d, dict) else "") or f"HTTP {status_code}"
                  return {"text": json.dumps({"error": f"AI(LLM Proxy)가 답을 못 했어요: {why}"[:300]}, ensure_ascii=False)}
              return {"text": text}

        variables:
        - variable: body
          value_selector:
          - ask
          - body
        - variable: status_code
          value_selector:
          - ask
          - status_code
        outputs:
          text:
            type: string
            children: null
    - id: end
      type: custom
      position:
        x: 2480
        y: 280
      positionAbsolute:
        x: 2480
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 142
      width: 244
      data:
        type: end
        title: 끝
        desc: ''
        selected: false
        outputs:
        - value_selector:
          - source
          - reference
          variable: reference
        - value_selector:
          - source
          - verse_text
          variable: verse_text
        - value_selector:
          - done
          - text
          variable: text
    - id: end_source
      type: custom
      position:
        x: 1280
        y: 480
      positionAbsolute:
        x: 1280
        y: 480
      sourcePosition: right
      targetPosition: left
      height: 90
      width: 244
      data:
        type: end
        title: 구절을 못 찾음
        desc: ''
        selected: false
        outputs:
        - value_selector:
          - source
          - error
          variable: text
    viewport:
      x: 0
      y: 0
      zoom: 0.6

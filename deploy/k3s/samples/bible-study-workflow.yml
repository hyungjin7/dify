          DISPUTED = set(["0|19|22", "0|22|17", "0|22|4", "0|45|12", "11|23|25", "13|34|30", "13|9|23", "14|1|6", "14|4|23", "17|29|17", "17|38|15", "18|100|1", "18|105|6", "18|10|15", "18|121|7", "18|124|3", "18|128|1", "18|139|2", "18|16|11", "18|21|9", "18|22|1", "18|29|5", "18|33|1", "18|34|20", "18|3|7", "18|58|7", "18|72|19", "18|72|20", "18|8|4", "18|92|2", "18|92|3", "19|13|10", "19|1|27", "1|12|7", "1|13|13", "1|13|15", "1|20|19", "1|33|13", "1|36|24", "1|9|25", "20|3|11", "21|6|13", "21|6|14", "22|14|2", "22|30|2", "22|44|2", "22|45|2", "22|48|2", "22|59|19", "23|21|2", "23|49|35", "23|50|31", "25|24|5", "25|4|9", "2|27|14", "30|1|12", "31|2|2", "37|13|4", "39|11|11", "39|11|12", "39|14|2", "39|14|8", "39|16|14", "39|17|13", "39|18|11", "39|21|25", "39|28|19", "39|3|1", "39|3|11", "39|3|13", "39|3|14", "39|3|16", "39|3|6", "39|3|7", "39|6|28", "39|9|14", "3|10|30", "3|14|29", "3|24|8", "3|7|74", "3|9|12", "40|10|38", "40|10|39", "40|11|26", "40|11|30", "40|15|28", "40|16|16", "40|1|4", "40|1|41", "40|1|5", "40|1|8", "40|1|9", "40|6|14", "40|6|24", "40|6|25", "40|8|28", "40|9|44", "40|9|46", "41|12|50", "41|15|14", "41|15|16", "41|17|36", "41|1|32", "41|20|4", "41|23|17", "41|2|5", "41|3|12", "41|3|16", "41|3|21", "41|3|3", "41|3|7", "41|6|12", "41|7|20", "41|7|29", "41|7|30", "41|7|33", "41|9|19", "42|10|40", "42|18|11", "42|1|25", "42|1|26", "42|1|28", "42|1|31", "42|1|33", "42|3|22", "42|3|23", "42|3|26", "42|4|1", "42|4|2", "43|10|37", "43|10|47", "43|10|48", "43|11|16", "43|13|24", "43|15|26", "43|15|34", "43|16|15", "43|16|33", "43|18|25", "43|18|8", "43|19|3", "43|19|4", "43|19|5", "43|1|10", "43|1|21", "43|1|5", "43|1|8", "43|22|16", "43|28|29", "43|2|38", "43|2|41", "43|8|12", "43|8|13", "43|8|16", "43|8|36", "43|8|37", "43|8|38", "43|9|18", "44|16|24", "44|16|5", "44|1|7", "44|6|16", "44|6|3", "44|6|4", "44|8|11", "44|8|35", "44|9|2", "45|10|2", "45|12|13", "45|15|29", "45|16|7", "45|1|13", "45|1|14", "45|1|15", "45|1|16", "45|1|17", "45|8|12", "47|1|10", "47|1|11", "47|3|27", "48|4|5", "49|4|19", "4|15|5", "4|30|10", "4|33|11", "4|6|19", "50|2|12", "52|2|16", "54|2|24", "57|11|2", "57|12|14", "57|4|12", "57|6|2", "58|1|12", "58|2|23", "58|3|17", "58|5|18", "59|3|21", "60|3|5", "65|18|2", "65|20|10", "65|2|19", "6|18|10", "6|5|17", "8|8|18", "9|7|16", "9|7|7"])
          PLACEHOLDER = re.compile(r"^\[?\d+절(\]과|과)\s*(같음|동일함|상동)\]?$")


          def fail(msg):
              return {"ok": 0, "reference": "", "verse_text": "", "context": "", "error": json.dumps({"error": msg}, ensure_ascii=False)}


          def main(body: str, status_code: int, book: str, book_index: int, chapter: int, verse: int) -> dict:
              if status_code != 200 or not body:
                  return fail(f"원본 성경 파일을 못 받았어요(HTTP {status_code}). Dify 검문소가 raw.githubusercontent.com 을 막는지 확인해 주세요")
              if hashlib.sha256(body.encode("utf-8")).hexdigest() != SHA.get(book):
                  return fail(f"{book} 원본 파일 지문이 달라서 쓰지 않았어요")
              chapters = {c["chapter"]: {v["verse"]: v["text"] for v in c["verses"]} for c in json.loads(body)["chapters"]}

              def usable(ch, v):
                  t = chapters.get(ch, {}).get(v)
                  return t is not None and t.strip() and not PLACEHOLDER.match(t.strip()) and f"{book_index}|{ch}|{v}" not in DISPUTED

              if chapter == 0:   # 랜덤
                  cands = [(ch, v) for ch, vs in chapters.items() for v in vs if usable(ch, v)]
                  chapter, verse = random.choice(cands)
              if chapter not in chapters:
                  return fail(f"{book}에는 {chapter}장이 없어요({len(chapters)}장까지 있어요)")
              if verse not in chapters[chapter]:
                  return fail(f"{book} {chapter}장에는 {verse}절이 없어요({max(chapters[chapter])}절까지 있어요)")
              if not usable(chapter, verse):
                  return fail(f"{book} {chapter}:{verse} 은 두 원본 자료가 서로 달라서 아직 쓰지 않아요")
              ctx = [f"{v} {chapters[chapter][v]}" for v in range(verse - 2, verse + 3) if v != verse and usable(chapter, v)]
              return {"ok": 1, "reference": f"{book} {chapter}:{verse}", "verse_text": chapters[chapter][verse],
                      "context": "\n".join(ctx), "error": ""}

        variables:
        - variable: body
          value_selector:
          - fetch
          - body
        - variable: status_code

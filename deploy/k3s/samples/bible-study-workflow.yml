# 말씀 스와이프(easybible) 구절 공부 v3 (2026-11-24 사용자 결정: "본문=앱, 관련 구절=Dify 지식").
# 구절 주소 하나만 넣는다(창세기 1장 1절, 창 1:1, 요 3:16 / 비우면 랜덤).
#   본문 = 우리 앱 http://easybible.easybible.svc.cluster.local/api/verse(= bible.delvrio.com, 검문소 허용 목록에 있음) (원본 대조를 통과한 절만, 원본 문자열 그대로). GitHub 를 부르지 않는다.
#   관련 구절 후보 = Dify 지식 "성경 개역한글"(한 절 = 한 조각, bible_to_dify_knowledge.py 로 올림)에서 뜻으로 8개 찾기.
#   AI 는 설명 7가지(JSON 글자 text)만 쓴다. 앱은 관련 구절 주소를 원본으로 다시 확인한다.
# 앱이 보내는 verse_text·context·translation 은 받아도 쓰지 않는다(본문은 항상 앱 API).
# 올리기(지식을 먼저 올린 뒤): SAVE_APP_KEY=easybible-dify-app SAVE_APP_KEY_NS=easybible \
#   INPUTS='{"reference":"창세기 1장 1절"}' python3 deploy/k3s/samples/install_app.py deploy/k3s/samples/bible-study-workflow.yml
app:
  description: 구절 주소만 넣으면(비우면 랜덤) 앱에서 원본 구절을 받고, 성경 지식에서 비슷한 구절을 찾아 AI 가 설명한다
  icon: 📖
  icon_background: '#E0F2FE'
  mode: workflow
  name: 말씀 스와이프 구절 공부
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: start-source-fetch
      source: start
      sourceHandle: 'source'
      target: fetch
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: fetch-source-source
      source: fetch
      sourceHandle: 'source'
      target: source
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: source-source-source_ok
      source: source
      sourceHandle: 'source'
      target: source_ok
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
      id: source_ok-true-kr
      source: source_ok
      sourceHandle: 'true'
      target: kr
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: end
      id: source_ok-false-end_source
      source: source_ok
      sourceHandle: 'false'
      target: end_source
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: kr-source-llm
      source: kr
      sourceHandle: 'source'
      target: llm
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: llm-source-end
      source: llm
      sourceHandle: 'source'
      target: end
      targetHandle: target
      type: custom
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 170
      width: 244
      data:
        type: start
        title: 시작
        desc: 구절 주소만 넣으면 돼요. 비우면 랜덤
        selected: false
        variables:
        - label: 구절 주소 (예 창세기 1장 1절, 요 3:16 / 비우면 랜덤)
          max_length: 100
          options: []
          required: false
          type: text-input
          variable: reference
        - label: (앱 전용) 구절 본문 - 비워 두세요
          max_length: 4000
          options: []
          required: false
          type: paragraph
          variable: verse_text
        - label: (앱 전용) 앞뒤 문맥 - 비워 두세요
          max_length: 8000
          options: []
          required: false
          type: paragraph
          variable: context
        - label: (앱 전용) 번역 - 비워 두세요
          max_length: 50
          options: []
          required: false
          type: text-input
          variable: translation
    - id: fetch
      type: custom
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 130
      width: 244
      data:
        type: http-request
        title: 앱에서 원본 구절 받기
        desc: 앱 easybible /api/verse (클러스터 안 주소, 원본 대조 통과한 절만)
        selected: false
        method: get
        url: http://easybible.easybible.svc.cluster.local/api/verse
        authorization:
          type: no-auth
          config: null
        headers: ''
        params: 'ref:{{#start.reference#}}'
        body:
          type: none
          data: []
        ssl_verify: true
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
        variables: []
    - id: source
      type: custom
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 54
      width: 244
      data:
        type: code
        title: 받은 구절 읽기
        desc: 앱 답(JSON)에서 주소·본문·앞뒤 문맥 꺼내기(본문은 그대로)
        selected: false
        code_language: python3
        code: |
          import json


          def main(body: str, status_code: int) -> dict:
              empty = {"ok": 0, "reference": "", "verse_text": "", "context": ""}
              if status_code != 200 or not body:
                  return {**empty, "error": json.dumps({"error": f"앱(easybible)에서 구절을 못 받았어요(HTTP {status_code})"}, ensure_ascii=False)}
              d = json.loads(body)
              if not d.get("ok"):
                  return {**empty, "error": json.dumps({"error": d.get("error") or "구절을 못 찾았어요"}, ensure_ascii=False)}
              return {"ok": 1, "reference": d["reference"], "verse_text": d["verse_text"], "context": d.get("context", ""), "error": ""}

        variables:
        - variable: body
          value_selector:
          - fetch
          - body
        - variable: status_code
          value_selector:
          - fetch
          - status_code
        outputs:
          ok:
            type: number
            children: null
          reference:
            type: string
            children: null
          verse_text:
            type: string
            children: null
          context:
            type: string
            children: null
          error:
            type: string
            children: null
    - id: source_ok
      type: custom
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 126
      width: 244
      data:
        type: if-else
        title: 구절을 찾았나
        desc: ''
        selected: false
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: c-source_ok
            comparison_operator: '='
            value: '1'
            varType: number
            variable_selector:
            - source
            - ok
    - id: kr
      type: custom
      position:
        x: 1280
        y: 280
      positionAbsolute:
        x: 1280
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 92
      width: 244
      data:
        type: knowledge-retrieval
        title: 비슷한 구절 찾기
        desc: 지식 "성경 개역한글"에서 뜻이 비슷한 구절 8개(관련 구절 후보)
        selected: false
        dataset_ids:
        - __DS:성경 개역한글__
        query_variable_selector:
        - source
        - verse_text
        retrieval_mode: multiple
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: reranking_model
          top_k: 8
    - id: llm
      type: custom
      position:
        x: 1580
        y: 280
      positionAbsolute:
        x: 1580
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 98
      width: 244
      data:
        type: llm
        title: 구절 설명(AI)
        desc: 설명 7가지를 JSON 으로 쓴다(본문은 쓰지 않는다)
        selected: false
        context:
          enabled: true
          variable_selector:
          - kr
          - result
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.3
          mode: chat
          name: gemma-4-E4B-it-MLX-8bit
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys-prompt
          role: system
          text: |-
            너는 성경을 쉽게 풀어 주는 한국어 선생님이다. 12살도 알아듣게 쓴다.
            아래 구절을 보고 JSON 하나만 답한다. 코드블록·다른 말은 쓰지 않는다.
            {"title": "", "meaning": "", "did_you_know": "", "background": "", "reflection": "", "prayer": "", "related": []}
            - title: 이 구절의 주제 (2~6글자, 예: 하나님의 사랑)
            - meaning: 성경적 의미 (3~4문장)
            - did_you_know: 배경 속 흥미로운 사실 1가지 (1~2문장). 확실하지 않으면 ""
            - background: 누가, 언제, 왜 한 말인지 (2~3문장). 확실하지 않으면 ""
            - reflection: 오늘 삶에 적용하는 묵상 (3~4문장)
            - prayer: 1인칭 짧은 기도 (2~3문장, "아멘"으로 끝)
            - related: 함께 읽을 구절 주소만 최대 3개 (예: "요한일서 4:9"). 아래 "비슷한 구절 후보"에서 이 구절과 뜻이 이어지는 것을 먼저 고르고, 이 구절 자신은 빼고, 본문은 쓰지 않는다
            규칙:
            - 성경 구절을 다시 쓰거나 바꿔 말하지 않는다. 인용이 필요하면 "이 말씀"이라고만 한다.
            - 확실한 것만 쓴다. 모르면 빈칸.
            - 교단 교리 논쟁은 피하고 위로와 적용 중심으로 쓴다.
        - id: user-prompt
          role: user
          text: |-
            구절: {{#source.reference#}} (개역한글)
            본문: {{#source.verse_text#}}
            앞뒤 문맥: {{#source.context#}}
            비슷한 구절 후보(성경 개역한글 지식):
            {{#context#}}
        variables: []
        vision:
          enabled: false
    - id: end
      type: custom
      position:
        x: 1880
        y: 280
      positionAbsolute:
        x: 1880
        y: 280
      sourcePosition: right
      targetPosition: left
      height: 142
      width: 244
      data:
        type: end
        title: 끝
        desc: ''
        selected: false
        outputs:
        - value_selector:
          - source
          - reference
          variable: reference
        - value_selector:
          - source
          - verse_text
          variable: verse_text
        - value_selector:
          - llm
          - text
          variable: text
    - id: end_source
      type: custom
      position:
        x: 1280
        y: 480
      positionAbsolute:
        x: 1280
        y: 480
      sourcePosition: right
      targetPosition: left
      height: 90
      width: 244
      data:
        type: end
        title: 구절을 못 찾음
        desc: ''
        selected: false
        outputs:
        - value_selector:
          - source
          - error
          variable: text
    viewport:
      x: 0
      y: 0
      zoom: 0.6

            children: null
            type: string
          body_youtube:
            children: null
            type: string
          body_company:
            children: null
            type: string
          body_industry:
            children: null
            type: string
          picked:
            children: null
            type: string
          period_used:
            children: null
            type: string
        selected: false
        title: 검색 요청 만들기
        type: code

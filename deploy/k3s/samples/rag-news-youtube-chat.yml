    - data:
        code: "import json\nimport re\n\nSOURCES = {\"news\": \"news\", \"youtube\": \"youtube\", \"company\": \"report_company\", \"industry\": \"report_industry\"}\n# 질문 낱말로 찾을 곳을 고른다(AI 를 한 번 더 부르지 않아 0초). 아무것도 안 걸리면 4곳 모두.\nRULES = {\n    \"youtube\": r\"유튜브|youtube|영상|채널|방송\",\n    \"news\": r\"뉴스|기사|보도\",\n    \"industry\": r\"산업\\s*분석|산업\\s*(리포트|레포트|보고서)|업황\\s*(리포트|보고서)|섹터\\s*(리포트|보고서)\",\n    \"company\": r\"종목\\s*분석|종목\\s*(리포트|레포트|보고서)|기업\\s*분석|목표\\s*가|투자\\s*의견\",\n}\nREPORT = r\"리포트|레포트|보고서|애널리스트|증권사\"\nPERIODS = [(r\"(\\d{1,3})\\s*일\", None), (r\"일주일|1\\s*주|한\\s*주\", 7), (r\"(\\d{1,2})\\s*주\", \"w\"),\n           (r\"한\\s*달|1\\s*개월|한\\s*개월\", 30), (r\"(\\d{1,2})\\s*개월|(\\d{1,2})\\s*달\", \"m\"),\n           (r\"반\\s*년\", 180), (r\"1\\s*년|일\\s*년|한\\s*해\", 365)]\n\n\ndef _period(q: str) -> str:\n    if not re.search(r\"최근|지난|동안|이내|간\", q):\n        return \"\"\n    for pat, val in PERIODS:\n        m = re.search(pat, q)\n        if not m:\n            continue\n        if val is\
          \ None:\n            n = int(m.group(1))\n        elif val == \"w\":\n            n = int(m.group(1)) * 7\n        elif val == \"m\":\n            n = int(next(g for g in m.groups() if g)) * 30\n        else:\n            n = val\n        return f\"{max(1, min(n, 3650))}d\"\n    return \"\"\n\n\ndef main(query: str, period: str, per_source: str) -> dict:\n    q = \" \".join(str(query or \"\").split())[:300]\n    low = q.lower()\n    picked = [k for k, pat in RULES.items() if re.search(pat, low)]\n    if re.search(REPORT, low) and not ({\"company\", \"industry\"} & set(picked)):\n        picked += [\"company\", \"industry\"]\n    if not picked:\n        picked = list(SOURCES)\n    try:\n        k = max(1, min(int(str(per_source or \"3\").strip()), 20))\n    except ValueError:\n        k = 3\n    # 고른 곳이 적으면 그만큼 더 많이(4곳×k 를 나눠 갖는다, 최대 20)\n    k = min(20, max(k, (k * 4) // len(picked)))\n    p = str(period or \"\").strip() or _period(q)\n    out = {\"picked\": \",\".join(picked),\
          \ \"period_used\": p or \"전체\"}\n    for key, kid in SOURCES.items():\n        # 고르지 않은 곳은 빈 질문 → rag 가 곧바로 빈 결과를 돌려준다\n        body = {\"knowledge_id\": f\"{kid}:{p}\" if p else kid, \"query\": q if key in picked else \"\",\n                \"retrieval_setting\": {\"top_k\": k, \"score_threshold\": 0}}\n        out[\"body_\" + key] = json.dumps(body, ensure_ascii=False)\n    return out\n"
        code_language: python3
        desc: 질문 낱말로 찾을 곳(뉴스·YouTube·종목분석·산업분석)과 기간(최근 30일 등)을 고르고 검색 요청을 만든다. 안 걸리면 4곳 모두
        outputs:

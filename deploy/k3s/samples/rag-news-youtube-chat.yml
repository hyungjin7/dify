    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 검색 결과(JSON records)만 근거로 답한다
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.3
          mode: chat
          name: gemma-4-E4B-it-MLX-8bit
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys-prompt
          role: system
          text: '너는 투자 정보 비서다. 아래 네 묶음은 사내 색인에서 같은 질문으로 찾은 자료(JSON, records 배열)다: 뉴스 · YouTube · 종목분석 리포트 · 산업분석 리포트.

            규칙:

            - 검색결과에 있는 내용만 근거로 한국어로 답한다. 없는 내용은 지어내지 말고 "찾은 자료에 없습니다"라고 말한다.

            - 이번에 찾은 곳: {{#build.picked#}} (기간: {{#build.period_used#}}). records 가 빈 묶음은 찾지 않은 곳이니 언급하지 않는다.

            - 질문과 관계있는 묶음만 쓴다. 답은 출처 묶음별 소제목(뉴스 / YouTube / 종목분석 / 산업분석)으로 나누고, 자료가 없거나 관계없는 묶음은 생략한다.

            - 근거는 [뉴스1], [YouTube2], [종목1], [산업3] 처럼 묶음 이름과 records 순서 번호로 문장 끝에 붙인다.

            - 각 자료 content 맨 앞 [게시일 … · N일 전] 을 보고 최신 자료를 먼저 쓰고, 오래된 자료는 오래됐다고 밝힌다. 날짜별 정리를 원하면 날짜순으로 쓴다.

            - 마지막에 ''출처'' 로 번호·제목·게시일(metadata.published_at)·URL(metadata.url) 을 나열한다.


            <뉴스>


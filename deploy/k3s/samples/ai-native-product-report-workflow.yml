        code: |
          import json
          from urllib.parse import urlparse


          def load(b):
              try:
                  return json.loads(b or "{}") or {}
              except ValueError:
                  return {}


          def main(pages: str, y1: str, y2: str, y3: str, note: str) -> dict:
              text, sources, n = [], [], 0
              for it in load(pages).get("items") or []:
                  body = (it.get("text") or "").strip()
                  if it.get("error") or len(body) < 300 or it.get("url") == "about:blank":
                      continue
                  n += 1
                  host = (urlparse(it.get("final_url") or it.get("url") or "").hostname or "").replace("www.", "")
                  title = (it.get("title") or host)[:120]
                  text.append(f"[자료{n}] (웹 · {host} · 게시일 본문 확인) {title}\n{body[:1500]}")
                  sources.append({"n": n, "kind": "웹", "channel": host, "date": "", "title": title,
                                  "url": it.get("final_url") or it.get("url") or ""})
              for raw in (y1, y2, y3):
                  v = load(raw)
                  if not v.get("video_id") or v.get("video_id") == "none":
                      continue
                  sub = (v.get("subtitle") or "").strip() or (v.get("description") or "").strip()
                  if len(sub) < 100:
                      continue
                  n += 1
                  date = v.get("upload_date") or "날짜 모름"
                  kind = "YouTube 자막" if v.get("subtitle") else "YouTube 설명"
                  title = (v.get("title") or "")[:120]
                  text.append(f"[자료{n}] ({kind} · {v.get('channel') or ''} · 업로드일 {date}) {title}\n{sub[:2500]}")
                  sources.append({"n": n, "kind": "YouTube", "channel": v.get("channel") or "", "date": date,
                                  "title": title, "url": v.get("url") or ""})
              web = sum(1 for s in sources if s["kind"] == "웹")
              return {"materials": "\n\n".join(text) or "(근거 자료 없음 — 모든 통계·시장 수치는 '확인 필요'로 표시할 것)",
                      "sources": json.dumps(sources, ensure_ascii=False),
                      "tally": f"근거 자료 {n}건(웹 {web} · YouTube {n - web}) · {note}"}
        code_language: python3
        desc: 기사·영상을 [자료N] 번호와 날짜로 묶는다(LLM 이 출처를 밝히게)
        outputs:

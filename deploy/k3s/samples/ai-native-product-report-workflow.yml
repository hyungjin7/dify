    - data:
        code: |
          import json

          LABEL = {"startup": "AI 창업·투자", "auto": "업무 자동화", "dev": "AI 개발 도구"}
          KIND = {"news": "뉴스", "youtube": "YouTube", "report": "리포트"}


          def main(b_startup: str, st_startup: int, b_auto: str, st_auto: int, b_dev: str, st_dev: int, count: str) -> dict:
              # 세 갈래 결과를 합쳐 같은 글(주소·제목)은 한 번만, 점수 높은 순으로 count 건. 번호 = [자료N]
              seen, rows, tally = set(), [], []
              for key, body, st in (("startup", b_startup, st_startup), ("auto", b_auto, st_auto), ("dev", b_dev, st_dev)):
                  try:
                      recs = (json.loads(body or "{}") or {}).get("records") or []
                  except ValueError:
                      recs = []
                  tally.append(f"{LABEL[key]} {len(recs)}건" + ("" if st == 200 else f"(실패 HTTP {st})"))
                  for r in recs:
                      m = r.get("metadata") or {}
                      k = m.get("url") or r.get("title") or ""
                      if not k or k in seen:
                          continue
                      seen.add(k)
                      rows.append((float(r.get("score") or 0), key, r, m))
              rows.sort(key=lambda x: -x[0])
              try:
                  n = int(count or "12")
              except ValueError:
                  n = 12
              rows = rows[:n]
              text, sources = [], []
              for i, (_, key, r, m) in enumerate(rows, 1):
                  date = (m.get("published_at") or "")[:10] or "날짜 모름"
                  kind = KIND.get(m.get("source") or "", m.get("source") or "자료")
                  ch = m.get("channel") or ""
                  title = (r.get("title") or "").strip()[:120]
                  text.append(f"[자료{i}] ({kind}{' · ' + ch if ch else ''} · 게시일 {date} · {LABEL[key]}) {title}\n"
                              + (r.get("content") or "").strip()[:700])
                  sources.append({"n": i, "title": title, "url": m.get("url") or "", "date": date, "kind": kind, "channel": ch})
              return {"materials": "\n\n".join(text) or "(근거 자료 없음 — 모든 통계·시장 수치는 '확인 필요'로 표시할 것)",
                      "sources": json.dumps(sources, ensure_ascii=False),
                      "tally": f"근거 자료 {len(rows)}건 사용 (" + ", ".join(tally) + ")"}
        code_language: python3
        desc: 세 갈래 결과를 합쳐 중복을 빼고 [자료N] 번호·게시일을 붙인다(LLM 이 출처를 밝히게)
        outputs:
          materials:
            children: null
            type: string
          sources:
            children: null
            type: string
          tally:
            children: null
            type: string
        selected: false
        title: 근거 자료 정리
        type: code
        variables:
        - value_selector:
          - s_startup
          - body
          variable: b_startup
        - value_selector:

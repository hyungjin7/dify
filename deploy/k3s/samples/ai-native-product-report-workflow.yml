    - data:
        code: |
          import json
          import re
          from urllib.parse import parse_qs, urlparse

          SKIP = re.compile(r"(^|\.)(google\.[a-z.]+|gstatic\.com|googleusercontent\.com|youtube\.com|youtu\.be|"
                            r"accounts\.|support\.|policies\.|blogger\.com)$")
          VID = re.compile(r"[?&]v=([A-Za-z0-9_-]{11})")


          def links(body):
              try:
                  return (json.loads(body or "{}") or {}).get("links") or []
              except ValueError:
                  return []


          def real(href):
              # Google 이 /url?q=<진짜 주소> 로 감싸는 경우를 벗긴다
              p = urlparse(href)
              if p.path == "/url" and "q" in parse_qs(p.query):
                  return parse_qs(p.query)["q"][0]
              return href


          def main(web: str, web_st: int, yt: str, yt_st: int, web_count: str, yt_count: str) -> dict:
              urls, hosts = [], set()
              for l in links(web):
                  href = real(str(l.get("href") or "").split("#")[0])
                  text = " ".join(str(l.get("text") or "").split())
                  host = (urlparse(href).hostname or "").lower()
                  if not href.startswith("http") or not host or SKIP.search(host) or len(text) < 10:
                      continue
                  if host in hosts:   # 한 사이트에 몰리지 않게 사이트당 1개
                      continue
                  hosts.add(host)
                  urls.append(href)
                  if len(urls) >= int(web_count):
                      break
              vids = []
              for l in links(yt):
                  m = VID.search(str(l.get("href") or ""))
                  if m and m.group(1) not in vids and "/shorts/" not in str(l.get("href")):
                      vids.append(m.group(1))
                  if len(vids) >= int(yt_count):
                      break
              vb = lambda i: json.dumps({"video_id": vids[i], "langs": ["ko", "en"]}) if i < len(vids) else '{"video_id": "none"}'
              note = (f"웹 검색 {'성공' if web_st == 200 else f'실패(HTTP {web_st})'} → 기사 {len(urls)}개, "
                      f"YouTube 검색 {'성공' if yt_st == 200 else f'실패(HTTP {yt_st})'} → 영상 {len(vids)}개")
              return {"pages_body": json.dumps({"urls": urls or ["about:blank"], "wait_until": "domcontentloaded",
                                                "wait_ms": 1200, "max_chars": 4000}, ensure_ascii=False),
                      "yt1": vb(0), "yt2": vb(1), "yt3": vb(2), "note": note}
        code_language: python3
        desc: 검색 결과 링크에서 기사 주소 N개, 영상 id K개를 고른다
        outputs:
          pages_body:
            children: null
            type: string
          yt1:
            children: null
            type: string
          yt2:
            children: null
            type: string
          yt3:
            children: null
            type: string
          note:
            children: null
            type: string
        selected: false
        title: 열 자료 고르기

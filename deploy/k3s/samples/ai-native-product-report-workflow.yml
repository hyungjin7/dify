    - data:
        code: |
          import json
          import re


          def main(body: str, status: int, sources: str, tally: str) -> dict:
              try:
                  d = json.loads(body or "{}") or {}
              except ValueError:
                  d = {}
              text = d.get("text") or ""
              if status != 200 or not text:
                  why = d.get("error") or ("응답 없음(시간 초과 등)" if not status else f"HTTP {status}")
                  return {"result": f"### ⚠️ 보고서 작성 실패\n- 원인: {why}\n- 확인: Prompt Templates 의 템플릿 이름(template_slug)·agent-dify-key\n- {tally}",
                          "chars": "0"}
              # 생각(think) 블록을 빼고, LLM 이 쓴 "참고 및 출처" 줄은 떼어 실제 인용한 [자료N] 만 제목·게시일·주소로 다시 쓴다.
              body = re.sub(r"<think>.*?</think>", "", text or "", flags=re.S).strip()
              try:
                  src = {s["n"]: s for s in json.loads(sources or "[]")}
              except (ValueError, KeyError, TypeError):
                  src = {}
              m = re.search(r"^\s*참고\s*및\s*출처\s*[:：].*\Z", body, flags=re.M | re.S)
              if m:
                  body = body[:m.start()].rstrip()
              cited = sorted({int(x) for g in re.findall(r"\[\s*자료\s*([\d,\s자료]+)", body)
                              for x in re.findall(r"\d+", g) if int(x) in src})
              lines = []
              for n in cited:
                  s = src[n]
                  where = " · ".join(x for x in (s.get("kind"), s.get("channel"), s.get("date")) if x)
                  t = s.get("title") or "자료"
                  lines.append(f"- [자료{n}] {where} · " + (f"[{t}]({s['url']})" if (s.get("url") or "").startswith("http") else t))
              tail = "참고 및 출처:\n" + ("\n".join(lines) if lines else "- 확인 필요 (본문에 인용한 근거 자료 없음)")
              # 분량 점검: 표 줄·머리글·구분선을 뺀 본문 글자 수(공백 제외). 1000자를 넘으면 표시만 한다
              plain = "".join(l for l in body.splitlines() if not l.lstrip().startswith(("|", "#", "---", "작성일")))
              size = len(re.sub(r"\s", "", plain))
              warn = f"\n\n> ⚠️ 본문 {size}자 — 목표 500~1000자 초과" if size > 1000 else ""
              out = f"{body}{warn}\n\n{tail}"
              return {"result": f"{out}\n\n<!-- ai-native-meta chars={size} cited={len(cited)} {tally} -->", "chars": str(size)}
        code_language: python3
        desc: 출처를 실제 인용한 자료로 다시 쓰고(없으면 '확인 필요'), 분량을 잰다
        outputs:
          result:
            children: null
            type: string
          chars:
            children: null
            type: string
        selected: false
        title: 결과 정리

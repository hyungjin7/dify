#   → 근거 자료 정리([자료N]·날짜) → 보고서 요청 만들기 → agent /dify/llm/template(LLM Proxy + Prompt Templates) → 결과 정리 → 텔레그램 → 끝.
# 브라우저는 사용자 Ego Lite 앱 하나(ego 서비스 CDP)만 쓴다. 다른 브라우저를 띄우지 않는다.
# 버핏 뉴스에서 뺀 단계: news 저장·중복 확인, 시장 소음 규칙·시총 범위·해자 점수·DART(상장 종목 전용), 상시 판정(보고서 1편).
# LLM 은 Dify 노드가 아니라 bbb LLM Proxy 로 부른다(프롬프트 정본 = Prompt Templates, 사용 기록 = LLM 로그).

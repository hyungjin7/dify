# AI Native 생산성 제품 창조(2026-11-24 사용자 요청: 버핏 뉴스와 기본 흐름을 같게, 주제만 "AI 시대 창업 아이템").
# 흐름(버핏 뉴스 ③ 요약과 같은 뼈대: 자료 모으기 → 자료 정리 → LLM 보고서 → 결과 정리 → 텔레그램 → 끝)
#   시작(slot·관심 분야·기간) → 검색 요청 만들기 → 우리 RAG 3갈래 동시 검색(AI 창업·투자 / 업무 자동화 / AI 개발 도구)
#   → 근거 자료 정리([자료N] 번호·게시일) → gemma One-Page 보고서 → 결과 정리(출처를 실제 인용한 자료로 다시 씀) → 텔레그램 → 끝.
# 버핏 뉴스에서 뺀 단계: ego 수집·news 저장(새로 모을 기사가 아니라 이미 모은 자료를 찾음), 시장 소음 제목 규칙·시총 1조 범위·
#   해자 5항목 점수·DART 대조(상장 종목 전용 규칙이라 창업 아이템에는 안 맞음), 상시 판정 2단계(보고서 1편이라 필요 없음).
# 근거 규칙: 숫자·통계는 <자료> 에 있는 것만 [자료N]·게시일과 함께 쓰고, 없으면 "확인 필요"로 적는다(사용자 지시).
# 올리기(앱을 만들 때만, 사용자 확인 뒤): python3 deploy/k3s/samples/install_app.py deploy/k3s/samples/ai-native-product-report-workflow.yml
#   시작 입력: INPUTS='{"focus": "물류 정산", "period": "30d"}' 처럼 줄 수 있다. 키(rag_api_key·telegram_*)는 install_app.py 가 Secret 에서 넣는다.

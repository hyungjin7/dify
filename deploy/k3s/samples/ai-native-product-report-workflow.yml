    - data:
        code: |
          import html
          import json
          import re

          LIMIT = 3800   # 텔레그램 한 번에 4096자까지


          def inline(t):
              out, pos = [], 0
              for m in re.finditer(r"\[([^\[\]]+)\]\((https?://[^)\s]+)\)", t):
                  out.append(html.escape(t[pos:m.start()]))
                  out.append(f'<a href="{html.escape(m.group(2), quote=True)}">{html.escape(m.group(1))}</a>')
                  pos = m.end()
              out.append(html.escape(t[pos:]))
              return re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", "".join(out))


          def main(report: str, chat_id: str) -> dict:
              body = re.sub(r"<!--.*?-->", "", report or "", flags=re.S).strip()
              lines, size = [], 0
              for raw in body.splitlines():
                  t = raw.rstrip()
                  if re.match(r"^\s*\|?\s*:?-{3,}", t) or t.strip() == "---":
                      continue
                  if t.lstrip().startswith("|"):
                      cells = [c.strip() for c in t.strip().strip("|").split("|")]
                      h = "• " + " · ".join(inline(c) for c in cells if c)
                  elif re.match(r"^#{1,6}\s", t):
                      h = "\n<b>" + inline(re.sub(r"^#{1,6}\s*", "", t)) + "</b>"
                  elif t.lstrip().startswith(">"):
                      h = "<i>" + inline(t.lstrip("> ").strip()) + "</i>"
                  elif re.match(r"^\s*[-*]\s*\S", t):
                      h = ("  " if t[:1].isspace() else "") + "• " + inline(re.sub(r"^\s*[-*]\s*", "", t))
                  else:
                      h = inline(t)
                  if size + len(h) + 1 > LIMIT:
                      lines.append("… 전체는 Dify 실행 기록")
                      break
                  lines.append(h)
                  size += len(h) + 1
              text = re.sub(r"\n{3,}", "\n\n", "\n".join(lines)).strip() or "(보고서 없음)"
              return {"body": json.dumps({"chat_id": (chat_id or "").strip(), "text": text, "parse_mode": "HTML",
                                          "disable_web_page_preview": True}, ensure_ascii=False)}
        code_language: python3
        desc: 보고서를 텔레그램 글(HTML)로. 표는 한 줄씩 '•' 로 바꾼다
        outputs:
          body:
            children: null
            type: string
        selected: false
        title: 텔레그램 글 만들기
        type: code
        variables:
        - value_selector:
          - finish
          - result
          variable: report
        - value_selector:
          - env
          - startup_telegram_chat_id
          variable: chat_id

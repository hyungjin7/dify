    - data:
        code: |
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from urllib.parse import quote_plus

          # 검색어: 사용자 프롬프트의 세 축(개발 민주화·수작업 자동화·AI 창업 기회). 관심 분야가 있으면 앞에 붙인다.
          WEB_Q = "AI 에이전트 스타트업 창업 아이템 업무 자동화 생산성"
          YT_Q = "AI 에이전트 창업 1인 개발 바이브코딩 SaaS 자동화"


          def main(focus: str, period: str, web_count: str, yt_count: str, slot: str) -> dict:
              kst = datetime.now(timezone(timedelta(hours=9)))
              day = (slot or "").strip()[:10]
              if not re.match(r"^\d{4}-\d{2}-\d{2}$", day):
                  day = kst.strftime("%Y-%m-%d")
              week = (period or "").strip().lower() == "7d"
              f = (focus or "").strip()

              def num(v, d, hi):
                  try:
                      return max(1, min(int(str(v).strip()), hi))
                  except ValueError:
                      return d
              wq, yq = f"{f} {WEB_Q}".strip(), f"{f} {YT_Q}".strip()
              # Google: tbs=qdr:w(1주)·qdr:m(1달). YouTube: sp=EgIIAw%3D%3D(이번 주)·EgIIBA%3D%3D(이번 달)
              web_url = f"https://www.google.com/search?q={quote_plus(wq)}&hl=ko&num=20&tbs=qdr:{'w' if week else 'm'}"
              yt_url = f"https://www.youtube.com/results?search_query={quote_plus(yq)}&sp={'EgIIAw%253D%253D' if week else 'EgIIBA%253D%253D'}"
              page = lambda u, s: json.dumps({"url": u, "wait_until": "domcontentloaded", "wait_ms": 2500,
                                              "include_links": True, "scroll_times": s, "scroll_wait_ms": 1200}, ensure_ascii=False)
              return {"today": day, "focus_used": f or "전체", "period_used": "최근 1주" if week else "최근 1달",
                      "web_body": page(web_url, 0), "yt_body": page(yt_url, 2),
                      "web_count": str(num(web_count, 6, 8)), "yt_count": str(num(yt_count, 3, 3))}
        code_language: python3
        desc: 작성일(KST)·기간을 정하고 Ego Lite 로 열 Google·YouTube 검색 주소를 만든다
        outputs:
          today:
            children: null
            type: string
          focus_used:
            children: null
            type: string
          period_used:
            children: null
            type: string
          web_body:
            children: null
            type: string
          yt_body:
            children: null
            type: string
          web_count:
            children: null
            type: string
          yt_count:
            children: null
            type: string

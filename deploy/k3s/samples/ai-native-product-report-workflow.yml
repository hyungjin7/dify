    - data:
        code: |
          import json
          import re
          from datetime import datetime, timedelta, timezone

          # 갈래별 검색어(AI 창업 아이템의 세 근거: 시장·투자 / 수작업 자동화 / 개발 민주화). 관심 분야가 있으면 앞에 붙인다.
          QUERIES = {
              "startup": "AI 스타트업 창업 투자 유치 AI 에이전트 신규 서비스 시장",
              "auto": "생성형 AI 업무 자동화 생산성 수작업 절감 기업 도입 사례",
              "dev": "AI 코딩 도구 바이브 코딩 개발자 생산성 소프트웨어 개발 비용",
          }


          def main(focus: str, period: str, count: str, slot: str) -> dict:
              kst = datetime.now(timezone(timedelta(hours=9)))
              day = (slot or "").strip()[:10]
              if not re.match(r"^\d{4}-\d{2}-\d{2}$", day):
                  day = kst.strftime("%Y-%m-%d")
              p = (period or "").strip().lower()
              p = p if re.match(r"^\d{1,3}d$", p) else "30d"
              try:
                  n = max(3, min(int(str(count or "12").strip()), 20))
              except ValueError:
                  n = 12
              f = (focus or "").strip()
              out = {"today": day, "period_used": p, "count": str(n), "focus_used": f or "전체"}
              for key, q in QUERIES.items():
                  body = {"knowledge_id": f"all:{p}", "query": f"{f} {q}".strip(),
                          "retrieval_setting": {"top_k": min(20, n), "score_threshold": 0}}
                  out["body_" + key] = json.dumps(body, ensure_ascii=False)
              return out
        code_language: python3
        desc: 작성일(KST)·기간·자료 수를 정하고 RAG 검색 요청 3개를 만든다

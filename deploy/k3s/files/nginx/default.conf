# Dify 경로 나누기 — 원본 docker/nginx/conf.d/default.conf.template 을 k8s Service 이름으로 옮긴 것.
# 앞단 Traefik 이 TLS 를 끝내므로 X-Forwarded-Proto 는 Traefik 이 준 값을 그대로 넘긴다.
map $http_x_forwarded_proto $dify_proto { default $http_x_forwarded_proto; "" $scheme; }
map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

# 요청마다 걸린 시간(초)을 남긴다: 총시간 · 뒤(api·web)가 답한 시간 · 상태 · 경로. 쿼리문자열(토큰)은 뺀다.
# 느린 화면 찾기: kubectl -n dify logs deploy/dify-nginx --since=30m | sort -rn | head -30
log_format dify_timing '$request_time $upstream_response_time $status $request_method $uri';

upstream dify_api    { server dify-api:5001;    keepalive 16; }
upstream dify_ws     { server dify-api-ws:5001; }
upstream dify_web    { server dify-web:3000;    keepalive 16; }
upstream dify_plugin { server dify-plugin-daemon:5002; }

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;
    access_log /dev/stdout dify_timing;

    # API JSON(앱 목록·워크플로 그래프)을 압축해 보낸다. 스트리밍(text/event-stream)은 넣지 않는다(버퍼링되면 답이 끊겨 보임).
    # web(Next.js)이 이미 압축한 응답은 nginx 가 다시 압축하지 않는다.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $dify_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /console/api { proxy_pass http://dify_api; }
    location /api         { proxy_pass http://dify_api; }
    location /v1          { proxy_pass http://dify_api; }
    location /openapi     { proxy_pass http://dify_api; }
    location /files       { proxy_pass http://dify_api; }
    location /mcp         { proxy_pass http://dify_api; }
    location /triggers    { proxy_pass http://dify_api; }
    location /callbacks/human-input/v2/im/ { proxy_pass http://dify_api; }

    location /socket.io/ {
        proxy_pass http://dify_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location /e/ {
        proxy_pass http://dify_plugin;
        proxy_set_header Dify-Hook-Url $dify_proto://$host$request_uri;
    }

    location /explore { proxy_pass http://dify_web; }
    location /        { proxy_pass http://dify_web; }

    location = /nginx-healthz { access_log off; return 200 "ok\n"; }
}

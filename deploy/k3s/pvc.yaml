# 영구 저장 = nfs-hdd(예상의 2배 이상). 올린 문서·이미지(api·worker 공유) / 설치한 플러그인.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dify-storage
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-hdd
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dify-plugin-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-hdd
  resources:
    requests:
      storage: 30Gi

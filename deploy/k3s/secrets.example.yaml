# 참고용 모양. 실제 값은 provision.py --apply 가 만든다(이 파일은 적용하지 않는다, 값 커밋 금지).
apiVersion: v1
kind: Secret
metadata:
  name: dify-db
  namespace: dify
stringData:
  DB_HOST: prod-pg-rw.postgre.svc.cluster.local
  DB_PORT: "5432"
  DB_USERNAME: dify
  DB_PASSWORD: "<생성>"
  DB_DATABASE: dify          # plugin-daemon 은 매니페스트에서 dify_plugin 으로 덮어쓴다
  PGVECTOR_HOST: prod-pg-rw.postgre.svc.cluster.local
  PGVECTOR_PORT: "5432"
  PGVECTOR_USER: dify
  PGVECTOR_PASSWORD: "<생성>"
  PGVECTOR_DATABASE: dify
---
apiVersion: v1
kind: Secret
metadata:
  name: dify-secret
  namespace: dify
stringData:
  SECRET_KEY: "<생성>"                          # API 암호화 키
  INIT_PASSWORD: "<생성>"                       # 첫 관리자 만들기(/install) 비밀번호
  DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: "<생성>" # 샌드박스 인증 토큰(agent-backend ↔ local-sandbox)
  DIFY_AGENT_API_TOKEN: "<생성>"
  DIFY_AGENT_SERVER_SECRET_KEY: "<생성>"
  PLUGIN_DAEMON_KEY: "<생성>"
  INNER_API_KEY_FOR_PLUGIN: "<생성>"
  CODE_EXECUTION_API_KEY: "<생성>"

# 지식 출처 모음 상주 수집기(2026-11-19 사용자 결정: 늘 켜진 수집기 하나가 미리보기·지금 갱신·정기 갱신을 맡는다).
# 출처 목록 정본 = bbb agent 표 knowledge_sources(화면 ccc › 지식 출처 모음). 수집기는 agent 에게 할 일을 받아 한 번에 하나씩 한다.
# 예전 CronJob tech-docs-sync 를 대신한다(지운 뒤: kubectl -n dify delete cronjob tech-docs-sync).
# 키: Secret knowledge-collector{token}(= bbb Secret knowledge-collector-token, samples/knowledge_collector_setup.py 가 둘 다 만든다),
#     Secret ncp-guide-sync{key}(Dify 지식 API 키). 상태 = NCP 와 같은 PVC ncp-guide-state 의 tech/ 폴더(예전 CronJob 과 같은 자리라 이어서 갱신).
# 정기 갱신 시각(KST 04:00 매일/매주 일)·지금 갱신·멈춤 판단은 agent 가 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-collector
  labels:
    app: knowledge-collector
spec:
  replicas: 1          # 반드시 1개(같은 출처를 둘이 받지 않게)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowledge-collector
  template:
    metadata:
      labels:
        app: knowledge-collector
    spec:
      # node-01 에 모은다(사용자 지시 2026-11-20). 우선 배치라 node-01 이 꺼지면 다른 노드에서 뜬다.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [bbb-node-01]
      containers:
      - name: collector
        image: python:3.12-slim
        command: ["python", "/app/knowledge_collector.py"]
        env:
        - {name: DIFY_URL, value: "http://dify-api:5001"}
        - {name: AGENT_URL, value: "http://agent-service.bbb-namespace.svc.cluster.local:8000"}
        - {name: STATE_DIR, value: /state/tech}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - name: COLLECTOR_TOKEN
          valueFrom: {secretKeyRef: {name: knowledge-collector, key: token, optional: true}}
        - name: DIFY_DATASET_KEY
          valueFrom: {secretKeyRef: {name: ncp-guide-sync, key: key, optional: true}}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 768Mi}
        volumeMounts:
        - {name: app, mountPath: /app}
        - {name: state, mountPath: /state}
      volumes:
      - name: app
        configMap:
          name: knowledge-collector
      - name: state
        persistentVolumeClaim:
          claimName: ncp-guide-state
